<!--
PLAN DE DISEÑO (6.0.2):
Sujeto y público: [NOMBRE_EMPRESA] en [CIUDAD], obrador de pastelería por encargo para celebraciones, bodas y empresas; usuarios móviles que necesitan fecha libre, precio y alérgenos claros antes de escribir por WhatsApp.
Tono y diales (6.0.4): Cercano, concreto y técnico del oficio, sin superlativos ni clichés. VARIANZA = 7, MOVIMIENTO = 4, DENSIDAD = 4 (herramientas de catálogo y configurador en 6).
Tipografía: Gloock (display de vitrina y rotulación firme, -0.02em) + Onest (interfaz y lectura clara, tabular-nums). Paleta: papel harina #FAF5EC (oklch .972 .013 78), masa #F2E8D8, cacao tostado #241712 (oklch .20 .028 45), grosella #9E2144 (oklch .47 .17 8, acción única) y caramelo #9C5A0E.
Composición: Hero asimétrico 5/7 con pastel de 3 pisos descentrado; grilla regular en catálogo; bloques sin caja (confianza, pasos, servicios, testimonios, equipo) separados por filetes de 1px; solo producto, categoría y diseño llevan contenedor.
Momentos firma: (1) Pastel SVG de 3 pisos que se arma al cargar en el hero; (2) Vista previa SVG reactiva del configurador de 6 pasos con transiciones CSS y FLIP.
Principio de movimiento: Un solo momento orquestado de carga (hero) + slider Por dentro y líneas de tiempo; todo lo demás responde al usuario con transform/opacity y respeta reduced-motion.
Revisión 6.0.3 y lo descartado (6.0.9): Sustituí Fraunces/Montserrat y terracota por Gloock/Onest y grosella de mayor contraste (>6.4:1); eliminé puntos medios entre metadatos, eyebrows en mayúsculas y el divisor de glaseado del footer para dejar uno solo en la banda Por dentro.
Reglas críticas: Plazos en CONFIG.ZONA_HORARIA con corte 16:00 y 12:00 hoy; cupos diarios con peso por línea; reserva válida solo tras confirmación y anticipo del [ANTICIPO_PORCENTAJE]%.
-->

  <style>
    @layer reset, tokens, base, layout, components, views, motion, utilities, print;

    /* === LAYER: RESET === */
    @layer reset {
      *, *::before, *::after { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
      body { margin: 0; font-kerning: none; }
      h1, h2, h3, h4, p, ul, ol, figure, blockquote, dl, dd { margin: 0; }
      ul, ol { padding: 0; list-style: none; }
      img, svg, picture, video { display: block; max-width: 100%; }
      button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
      button { background: none; border: 0; cursor: pointer; }
      a { color: inherit; text-decoration: none; }
      fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
      table { border-collapse: collapse; width: 100%; }
    }

    /* === LAYER: TOKENS === */
    @layer tokens {
      @font-face {
        font-family: "Gloock Fallback";
        src: local("Georgia"), local("Times New Roman");
        size-adjust: 104%;
        ascent-override: 94%;
        descent-override: 24%;
      }
      @font-face {
        font-family: "Onest Fallback";
        src: local("system-ui"), local("-apple-system"), local("Segoe UI");
        size-adjust: 100%;
        ascent-override: 95%;
      }

      :root {
        color-scheme: light;
        --font-display: "Gloock", "Gloock Fallback", Georgia, serif;
        --font-ui: "Onest", "Onest Fallback", system-ui, -apple-system, sans-serif;

        --bg: #FAF5EC;
        --bg: oklch(0.972 0.013 78);
        --bg-alt: #F2E8D8;
        --bg-alt: oklch(0.935 0.024 76);
        --surface: #FFFDF8;
        --surface: oklch(0.992 0.006 80);
        --surface-2: #EAE0CF;
        --surface-2: oklch(0.905 0.025 74);
        --border: #DFCFB8;
        --border: oklch(0.855 0.032 75);
        --border-strong: #C3AE90;
        --border-strong: oklch(0.745 0.042 72);

        --cacao: #241712;
        --cacao: oklch(0.20 0.028 45);
        --cacao-2: #34221B;
        --cacao-2: oklch(0.265 0.032 45);
        --on-cacao: #FAF5EC;
        --on-cacao: oklch(0.972 0.013 78);
        --on-cacao-soft: #DFCFBE;
        --on-cacao-soft: oklch(0.86 0.025 65);
        --border-cacao: #4E372D;
        --border-cacao: oklch(0.36 0.035 46);

        --text: #241712;
        --text: oklch(0.20 0.028 45);
        --text-soft: #594439;
        --text-soft: oklch(0.39 0.035 48);
        --text-faint: #6D584C;
        --text-faint: oklch(0.46 0.030 50);

        --brand: #9E2144;
        --brand: oklch(0.47 0.17 8);
        --brand-hover: #831937;
        --brand-hover: oklch(0.40 0.165 8);
        --brand-deep: #6B132C;
        --brand-deep: oklch(0.34 0.145 8);
        --brand-soft: rgba(158, 33, 68, 0.10);
        --on-brand: #FFFFFF;

        --caramelo: #9C5A0E;
        --caramelo: oklch(0.53 0.13 65);
        --success: #22663E;
        --warning: #924D00;
        --danger: #A62119;

        --il-bizcocho: #E8C48A;
        --il-crema: #FFF4E0;
        --il-chocolate: #5B3A29;
        --il-fresa: #C94768;
        --il-caramelo: #C47A1E;

        --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px;
        --s-5: 24px; --s-6: 32px; --s-7: 48px; --s-8: 64px;
        --s-9: 96px; --s-10: 128px;

        --r-btn: 10px;
        --r-card: 18px;
        --r-media: 14px;
        --r-modal: 24px;
        --r-chip: 999px;

        --shadow-modal: 0 24px 64px rgba(36, 23, 18, 0.34);
        --shadow-modal: 0 24px 64px oklch(0.2 0.04 50 / 0.35);

        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
        --d-fast: 150ms;
        --d-base: 220ms;
        --d-slow: 500ms;
        --d-hero: 800ms;

        --header-h: 64px;
        --container-max: 1280px;
        --gutter: clamp(16px, 4vw, 40px);
      }

      @media (min-width: 1024px) {
        :root { --header-h: 72px; }
      }
    }

    /* === LAYER: BASE === */
    @layer base {
      html {
        scroll-padding-top: calc(var(--header-h) + 64px);
        scroll-padding-bottom: 84px;
      }

      body {
        font-family: var(--font-ui);
        font-size: 1rem;
        line-height: 1.6;
        color: var(--text);
        background-color: var(--bg);
        overflow-x: clip;
      }

      h1, h2, .t-display {
        font-family: var(--font-display);
        font-weight: 400;
        text-wrap: balance;
      }

      .t-display {
        font-size: clamp(2.35rem, 1.2rem + 4.8vw, 4.15rem);
        line-height: 1.03;
        letter-spacing: -0.02em;
      }

      h1 {
        font-size: clamp(2rem, 1.2rem + 2.8vw, 3rem);
        line-height: 1.08;
        letter-spacing: -0.015em;
      }

      h2 {
        font-size: clamp(1.625rem, 1rem + 1.8vw, 2.25rem);
        line-height: 1.15;
        letter-spacing: -0.01em;
      }

      h3 {
        font-family: var(--font-ui);
        font-size: 1.25rem;
        font-weight: 600;
        line-height: 1.3;
        text-wrap: balance;
      }

      p {
        max-width: 68ch;
        text-wrap: pretty;
      }

      :focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
      }

      .band-dark :focus-visible,
      .site-footer :focus-visible,
      .notice-bar :focus-visible,
      .band-brand :focus-visible {
        outline-color: var(--on-cacao);
      }

      .skip-link {
        position: fixed;
        top: -120px;
        left: 16px;
        z-index: 200;
        background: var(--cacao);
        color: var(--on-cacao);
        padding: 12px 20px;
        border-radius: var(--r-btn);
        font-weight: 600;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
      }
      .skip-link:focus { top: 12px; }

      .tabular { font-variant-numeric: tabular-nums; }
      .data-label {
        font-size: 0.75rem;
        line-height: 1.3;
        font-weight: 600;
        color: var(--text-soft);
      }
      mark {
        background: var(--brand-soft);
        color: inherit;
        padding: 0 2px;
        border-radius: 3px;
      }

      @media (prefers-contrast: more) {
        :root {
          --border: #9E886B;
          --border-strong: #6A5542;
          --text-soft: #3B2920;
          --text-faint: #4A352A;
        }
      }

      @media (forced-colors: active) {
        .btn, .card-box, .chip, .modal-panel, .drawer-panel {
          border: 1px solid CanvasText;
        }
      }
    }

    /* === LAYER: LAYOUT === */
    @layer layout {
      .container {
        width: 100%;
        max-width: var(--container-max);
        margin-inline: auto;
        padding-inline: var(--gutter);
      }

      .band {
        padding-block: var(--s-8);
        background-color: var(--bg);
        position: relative;
      }
      .band-alt { background-color: var(--bg-alt); }
      .band-dark {
        background-color: var(--cacao);
        color: var(--on-cacao);
        --text: var(--on-cacao);
        --text-soft: var(--on-cacao-soft);
        --text-faint: var(--on-cacao-soft);
        --surface: var(--cacao-2);
        --border: var(--border-cacao);
        --border-strong: var(--border-cacao);
      }
      .band-brand {
        background-color: var(--brand-deep);
        color: var(--on-brand);
        --text: var(--on-brand);
        --text-soft: #F3DCE3;
      }

      @media (min-width: 1024px) {
        .band { padding-block: var(--s-9); }
      }

      .band-lazy {
        content-visibility: auto;
        contain-intrinsic-size: 1px 640px;
      }

      .section-head {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: var(--s-4);
        margin-bottom: var(--s-6);
      }
      .section-head-copy { display: grid; gap: var(--s-2); }
      .section-sub { color: var(--text-soft); font-size: 1.0625rem; }

      .grid-12 {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: var(--s-4);
      }
      @media (min-width: 768px) {
        .grid-12 { gap: var(--s-5); }
      }

      .grid-products {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: var(--s-4);
      }
      @media (min-width: 420px) {
        .grid-products { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (min-width: 1024px) {
        .grid-products { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-5); }
      }
      @media (min-width: 1280px) {
        .grid-products { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      }

      .grid-cats {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: var(--s-4);
      }
      @media (min-width: 768px) {
        .grid-cats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-5); }
      }
      @media (min-width: 1024px) {
        .grid-cats {
          grid-template-columns: repeat(4, minmax(0, 1fr));
          grid-auto-flow: dense;
        }
        .cat-card-hero { grid-column: span 2; grid-row: span 2; min-height: 464px; }
        .cat-card-wide { grid-column: span 2; }
      }

      .grid-gallery {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: var(--s-4);
      }
      @media (min-width: 480px) {
        .grid-gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (min-width: 1024px) {
        .grid-gallery { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-5); }
        .gallery-card-lead { grid-row: span 2; }
      }
    }

    /* === LAYER: COMPONENTS === */
    @layer components {
      .debug-allergen-bar {
        background: #FFF0D6;
        color: #5C3000;
        border-bottom: 1px solid #D9A75A;
        padding: 10px var(--gutter);
        font-size: 0.875rem;
        font-weight: 600;
        text-align: center;
      }

      .notice-bar {
        background-color: var(--cacao);
        color: var(--on-cacao);
        font-size: 0.8125rem;
        min-height: 40px;
        display: flex;
        align-items: center;
      }
      .notice-bar-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--s-3);
        padding-block: 6px;
        flex-wrap: wrap;
      }
      .notice-status, .notice-mid {
        display: inline-flex;
        align-items: center;
        gap: var(--s-2);
      }
      .notice-mid { color: var(--on-cacao-soft); }
      .notice-close {
        min-width: 44px;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--r-btn);
        color: var(--on-cacao);
        margin-block: -6px;
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 60;
        height: var(--header-h);
        background-color: var(--bg);
        border-bottom: 1px solid transparent;
        transition: border-color 180ms var(--ease-out);
      }
      .site-header.is-scrolled { border-bottom-color: var(--border); }
      .header-inner {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--s-4);
      }
      .brand-link {
        display: inline-flex;
        align-items: center;
        gap: var(--s-2);
        font-family: var(--font-display);
        font-size: 1.25rem;
        min-height: 44px;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .primary-nav {
        display: none;
        position: relative;
        align-items: center;
        gap: var(--s-1);
      }
      @media (min-width: 1024px) {
        .primary-nav { display: flex; }
      }
      .nav-tab {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 8px 14px;
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--text-soft);
        white-space: nowrap;
        border-radius: var(--r-btn);
        transition: color var(--d-fast) var(--ease-out);
      }
      .nav-tab[aria-current="page"] { color: var(--text); }
      @media (hover: hover) {
        .nav-tab:hover { color: var(--text); }
      }
      .nav-indicator {
        position: absolute;
        bottom: 4px;
        left: 0;
        height: 2px;
        width: 0;
        background-color: var(--brand);
        border-radius: 2px;
        pointer-events: none;
        transition: transform 250ms var(--ease-out), width 250ms var(--ease-out);
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: var(--s-2);
        flex-shrink: 0;
      }
      .icon-btn {
        position: relative;
        min-width: 44px;
        min-height: 44px;
        padding-inline: 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: var(--r-btn);
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--text);
        transition: background-color var(--d-fast) var(--ease-out);
      }
      @media (hover: hover) {
        .icon-btn:hover { background-color: var(--bg-alt); }
      }
      .bag-count {
        min-width: 22px;
        height: 22px;
        padding-inline: 6px;
        border-radius: var(--r-chip);
        background-color: var(--brand);
        color: var(--on-brand);
        font-size: 0.75rem;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .bag-subtotal { display: none; }
      @media (min-width: 1280px) {
        .bag-subtotal { display: inline; color: var(--text-soft); }
      }
      .header-cta { display: none; }
      @media (min-width: 768px) {
        .header-cta { display: inline-flex; }
      }
      .menu-toggle { display: inline-flex; }
      @media (min-width: 1024px) {
        .menu-toggle { display: none; }
      }
      .scroll-progress {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2px;
        background-color: var(--brand);
        transform-origin: left center;
        transform: scaleX(0);
        pointer-events: none;
      }

      .btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 48px;
        padding: 0 22px;
        border-radius: var(--r-btn);
        font-size: 0.9375rem;
        font-weight: 600;
        line-height: 1.2;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color var(--d-fast) var(--ease-out), border-color var(--d-fast) var(--ease-out), color var(--d-fast) var(--ease-out), transform 100ms var(--ease-out);
      }
      .btn-sm { min-height: 40px; padding: 0 16px; font-size: 0.875rem; }
      .btn-sm::before {
        content: "";
        position: absolute;
        inset: -4px 0;
      }
      .btn-lg { min-height: 56px; padding: 0 28px; font-size: 1rem; }
      .btn:active:not(:disabled) { transform: scale(0.97); }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }

      .btn-primary {
        background-color: var(--brand);
        color: var(--on-brand);
      }
      @media (hover: hover) {
        .btn-primary:hover:not(:disabled) { background-color: var(--brand-hover); }
      }

      .btn-secondary {
        background-color: transparent;
        border: 1px solid var(--border-strong);
        color: var(--text);
      }
      @media (hover: hover) {
        .btn-secondary:hover:not(:disabled) { border-color: var(--brand); color: var(--brand); }
      }

      .btn-inverse {
        background-color: var(--surface);
        color: var(--brand-deep);
      }
      @media (hover: hover) {
        .btn-inverse:hover:not(:disabled) { background-color: var(--bg-alt); }
      }

      .btn-tertiary {
        min-height: 44px;
        padding: 0 4px;
        border-radius: 6px;
        color: var(--text);
        text-decoration: underline;
        text-underline-offset: 4px;
        text-decoration-thickness: 1px;
      }
      .btn-tertiary .ic-arrow-move {
        transition: transform var(--d-fast) var(--ease-out);
      }
      @media (hover: hover) {
        .btn-tertiary:hover:not(:disabled) { color: var(--brand); }
        .btn-tertiary:hover:not(:disabled) .ic-arrow-move { transform: translateX(4px); }
      }

      .btn.is-loading { pointer-events: none; }
      .spinner-ring {
        width: 16px;
        height: 16px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spin-ring 600ms linear infinite;
      }

      .chip {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 36px;
        padding: 0 16px;
        border-radius: var(--r-chip);
        border: 1px solid var(--border);
        background-color: var(--surface);
        color: var(--text);
        font-size: 0.875rem;
        font-weight: 600;
        white-space: nowrap;
        transition: background-color var(--d-fast) var(--ease-out), border-color var(--d-fast) var(--ease-out);
      }
      .chip::before {
        content: "";
        position: absolute;
        inset: -4px 0;
      }
      @media (hover: hover) {
        .chip:hover { border-color: var(--brand); }
      }
      .chip[aria-pressed="true"],
      .chip.is-active {
        background-color: var(--brand-soft);
        border-color: var(--brand);
        color: var(--text);
      }
      .chip-count { color: var(--text-soft); font-weight: 400; font-variant-numeric: tabular-nums; }

      .card-box {
        position: relative;
        background-color: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-card);
        transition: border-color 250ms var(--ease-out), background-color 250ms var(--ease-out);
      }
      .stretched-link::after {
        content: "";
        position: absolute;
        inset: 0;

      .badge-nuevo { background-color: var(--brand); color: var(--on-brand); }
      .badge-temporada { background-color: var(--surface); border: 1px solid var(--caramelo); color: var(--text); }
      .badge-mas-pedido { background-color: var(--surface-2); color: var(--text); }
      .badge-encargo { background-color: var(--surface); border: 1px solid var(--border-strong); color: var(--text); }
      .badge-agotado { background-color: var(--surface-2); color: var(--text-faint); }

      .fav-btn {
        position: absolute;
        top: 4px;
        right: 4px;
        z-index: 3;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background-color: rgba(255, 253, 248, 0.9);
        border: 1px solid var(--border);
        color: var(--text);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: color var(--d-fast) var(--ease-out), border-color var(--d-fast) var(--ease-out), transform 160ms var(--ease-out);
      }

      .fav-btn.is-pulsing { transform: scale(1.12); }

      .product-body {

        flex-direction: column;

      .product-title {

      .rating-row {

      .product-price-row {

      .price-old { font-size: 0.875rem; color: var(--text-faint); text-decoration: line-through; font-variant-numeric: tabular-nums; }
      .price-disc { font-size: 0.75rem; font-weight: 700; color: var(--caramelo); }

      .avail-row {
        display: inline-flex;

        gap: 8px;
        font-size: 0.75rem;

      .avail-dot {
        width: 8px;
        height: 8px;

        flex-shrink: 0;
      }
      .product-foot {
        padding-top: 6px;

        font-weight: 600;
        color: var(--brand);
      }

      .cat-card {
        min-height: 220px;

      .cat-content { position: relative; max-width: 66%; display: grid; gap: 4px; }
      .cat-meta { font-size: 0.8125rem; color: var(--text-soft); }
      .cat-arrow {

        bottom: 16px;

        height: 40px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background-color: var(--surface);

        align-items: center;
        justify-content: center;

      }
      @media (hover: hover) {
        .cat-card:hover .cat-arrow,
        .cat-card:focus-within .cat-arrow {
          transform: translateX(4px);
          border-color: var(--brand);
          color: var(--brand);

      .unboxed-grid {

      }
      @media (min-width: 768px) {
        .unboxed-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: var(--s-6); }
        .unboxed-grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: var(--s-5); }

      .unboxed-block {

      .trust-strip {

      .trust-item:hover .trust-title,
      .trust-item:focus-within .trust-title {

        text-underline-offset: 3px;
      }
      .trust-title { font-size: 1.0625rem; font-weight: 700; display: block; }
      .trust-desc { font-size: 0.8125rem; color: var(--text-soft); display: block; margin-top: 2px; }

      .gallery-card {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .gallery-media {

      }

      .icing-divider-wrap {

        margin-bottom: -1px;

      }

        max-width: none;

        will-change: transform;
      }

      .field { display: grid; gap: 6px; }
      .field-label { font-size: 0.875rem; font-weight: 600; }

        font-size: 0.8125rem;

      .input, .select, .textarea {

        background-color: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-btn);
        cursor: pointer;
        transition: border-color var(--d-fast) var(--ease-out), background-color var(--d-fast) var(--ease-out);

      .option-card input {
        position: absolute;

        height: 20px;

      .option-price { font-size: 0.875rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }

      .swatch-row {

      .swatch-item {

      .swatch-circle {
        width: 44px;

        align-items: center;
        justify-content: center;
      }
      .swatch-item:has(input:focus-visible) .swatch-circle {
        outline: 2px solid var(--brand);

      }
      .swatch-item:has(input:checked) .swatch-circle {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
      }
      .swatch-name { font-size: 0.75rem; line-height: 1.25; }

      .cal-wrap {
        background-color: var(--surface);

        padding: var(--s-4);

        gap: var(--s-4);

      .cal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--s-2);

      .cal-grid {

        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 4px;
      }
      .cal-dow {
        text-align: center;

        font-weight: 600;
        color: var(--text-soft);
        padding-bottom: 6px;

      .cal-day {
        min-height: 44px;

        font-size: 0.875rem;

      .cal-day[data-state="available"] {

      .cal-legend {
        display: flex;

        gap: var(--s-3);
        font-size: 0.75rem;
        color: var(--text-soft);
      }

      .cal-swatch { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--border-strong); }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 100;
        background-color: rgba(20, 10, 5, 0.62);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--s-4);
        overflow-y: auto;
      }
      .modal-backdrop[hidden] { display: none; }
      .modal-panel {
        width: 100%;
        max-height: 92vh;
        max-height: 92dvh;
        overflow-y: auto;
        background-color: var(--bg);
        border: 1px solid var(--border);

        padding: var(--s-5);

      .modal-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: var(--s-4);
        margin-bottom: var(--s-4);
      }

      .drawer-backdrop {

        z-index: 110;

        display: flex;
        justify-content: flex-end;

      .sheet-backdrop {

      }

        max-height: 85dvh;

        border-top-left-radius: var(--r-modal);
        border-top-right-radius: var(--r-modal);
        padding: var(--s-5);
        display: grid;
        gap: var(--s-4);
      }

      .toast-stack {
        position: fixed;
        z-index: 140;
        bottom: 16px;
        right: 16px;
        left: 16px;

        gap: 8px;

        justify-items: center;

      .toast-item {

        justify-content: space-between;
        gap: 12px;
        font-size: 0.875rem;
      }
      .toast-action { color: var(--on-cacao); text-decoration: underline; font-weight: 600; min-height: 44px; display: inline-flex; align-items: center; }

      .accordion-item {
        border-top: 1px solid var(--border);
      }
      .accordion-item:last-child { border-bottom: 1px solid var(--border); }
      .accordion-summary {

      .stepper-box {

      .site-footer {

      }
      @media (min-width: 1024px) {

        min-height: 44px;

        font-size: 0.9375rem;
      }
      @media (hover: hover) {
        .footer-link:hover { color: var(--on-cacao); text-decoration: underline; }
      }
      .footer-legal {
        margin-top: var(--s-6);
        padding-top: var(--s-5);
        border-top: 1px solid var(--border-cacao);
        display: grid;
        gap: var(--s-3);
        font-size: 0.8125rem;
        color: var(--on-cacao-soft);
      }
    }

    /* === LAYER: VIEWS === */
    @layer views {
      .hero-band {
        min-height: 88vh;
        min-height: 88dvh;
        display: flex;
        align-items: center;
        padding-block: var(--s-7);
        overflow: hidden;
      }
      .hero-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: var(--s-6);
        align-items: center;
      }
      @media (min-width: 1024px) {
        .hero-grid { grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--s-5); }
        .hero-copy { grid-column: 1 / span 5; }
        .hero-visual { grid-column: 6 / span 7; justify-self: end; }
      }
      .hero-copy { display: grid; gap: var(--s-4); justify-items: start; }
      .hero-sub { font-size: 1.125rem; color: var(--text-soft); }
      .hero-actions { display: flex; flex-wrap: wrap; gap: var(--s-3); }
      .hero-trust-row {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s-5);
        font-size: 0.8125rem;
        color: var(--text-soft);
      }
      .hero-trust-item { display: inline-flex; align-items: center; gap: 6px; }

      .hero-visual {
        position: relative;
        width: min(560px, 100%);
        margin-inline: auto;
      }
      .hero-cake-svg { width: 100%; height: auto; }
      .hero-float-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--s-2);
        margin-top: var(--s-3);
      }
      .hero-float-card {
        background-color: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-btn);
        padding: 10px 14px;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.875rem;
        font-weight: 600;
        position: relative;
      }
      @media (min-width: 768px) {
        .hero-float-grid {
          position: absolute;
          inset: 0;
          pointer-events: none;
          display: block;
          margin-top: 0;
        }
        .hero-float-card {
          position: absolute;
          pointer-events: auto;
        }
        .hero-float-card:nth-child(1) { top: 8%; left: -4%; }
        .hero-float-card:nth-child(2) { top: 18%; right: -2%; }
        .hero-float-card:nth-child(3) { bottom: 20%; left: -6%; }
        .hero-float-card:nth-child(4) { bottom: 8%; right: 2%; }
      }

      .steps-row {
        position: relative;
        display: grid;

      @media (min-width: 1024px) {

        color: var(--cacao);

        justify-content: center;

      .compare-divider {

        bottom: 0;

        z-index: 5;

        height: 44px;

        align-items: center;

      .catalog-seg {

        align-items: center;

      .seg-group {
        display: inline-flex;
        background-color: var(--bg-alt);
        padding: 3px;
        border-radius: var(--r-btn);
        gap: 4px;

      .seg-btn {
        min-height: 36px;
        padding: 0 16px;
        border-radius: 8px;
        font-size: 0.875rem;
        font-weight: 600;

      .search-box svg {
        position: absolute;

        transform: translateY(-50%);

      .search-input {
        width: 100%;

        display: flex;

      .builder-layout {
        display: grid;

      }
      @media (min-width: 1024px) {
        .builder-layout { grid-template-columns: 1.4fr 1fr; }
        .builder-aside { position: sticky; top: calc(var(--header-h) + 20px); }
      }
      .builder-preview-card {
        background-color: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-card);
        padding: var(--s-4);
        display: grid;
        gap: var(--s-3);

      .builder-svg {
        width: 100%;

        background-color: var(--bg-alt);

      .stepper-list {
        display: none;
        grid-template-columns: repeat(6, minmax(0, 1fr));

      .stepper-item-btn {
        min-height: 44px;

        border: 1px solid var(--border);
        border-radius: var(--r-btn);

        align-items: center;

      .stepper-item-btn[aria-current="step"] {
        border-color: var(--brand);
        background-color: var(--brand-soft);

      .mobile-builder-bar {
        position: sticky;

        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--s-3);

      @media (min-width: 1024px) {
        .mobile-builder-bar { display: none; }

        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: var(--s-5);

        gap: var(--s-2);

      .pdp-thumb-btn {
        aspect-ratio: 4 / 3;

        border: 1px solid var(--border);

        min-height: 44px;

        display: grid;
        grid-template-columns: minmax(0, 1fr);

      .timeline-vertical {
        position: relative;
        padding-left: var(--s-6);
        display: grid;
        gap: var(--s-5);

      .timeline-line-v {
        position: absolute;
        top: 6px;
        bottom: 6px;
        left: 11px;
        width: 2px;
        background-color: var(--brand);
        transform-origin: top center;

      .timeline-node {
        position: relative;
        display: grid;
        gap: 4px;
      }
      .timeline-node::before {
        content: "";

        left: calc(-1 * var(--s-6) + 5px);

        width: 14px;
        height: 14px;
        border-radius: 50%;
        background-color: var(--surface);
        border: 2px solid var(--brand);

      .team-avatar {

        height: 72px;

        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 1.125rem;
      }
      .team-avatar img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

    /* === LAYER: MOTION === */
    @layer motion {
      @keyframes spin-ring { to { transform: rotate(360deg); } }
      @keyframes fade-150 { from { opacity: 0; } to { opacity: 1; } }
      @keyframes shimmer-load {
        from { transform: translateX(-100%); }
        to { transform: translateX(100%); }
      }
      @keyframes candle-flicker {
        0% { transform: scaleY(0.94) translateX(-0.6px); }
        100% { transform: scaleY(1.06) translateX(0.6px); }
      }

      .skeleton-card {
        height: 320px;
        border-radius: var(--r-card);
        background-color: var(--surface-2);
        position: relative;
        overflow: hidden;
      }
      .skeleton-card::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255, 253, 248, 0.55), transparent);
        animation: shimmer-load 1.4s linear infinite;
      }

      .hero-line-clip { display: block; overflow: hidden; }
      .hero-line-inner {
        display: block;
        transform: translateY(100%);
        transition: transform 700ms var(--ease-out);

      .hero-ready .hero-line-inner { transform: translateY(0); }

      [data-reveal] {
        opacity: 0;
        transform: translateY(16px);
        transition: opacity var(--d-slow) var(--ease-out), transform var(--d-slow) var(--ease-out);
      }
      [data-reveal].is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      .flame-flicker {
        transform-origin: center bottom;
        animation: candle-flicker 1.8s ease-in-out 0s 3 alternate;
      }
      .flame-flicker-b { animation-delay: 280ms; }
      .is-offscreen .flame-flicker { animation-play-state: paused; }

      @keyframes icing-wave {
        0% { transform: translateX(0) translateY(0); }
        100% { transform: translateX(-8%) translateY(2px); }
      }
      @keyframes hotspot-breathe {
        0%, 100% { box-shadow: 0 0 0 0 rgba(250, 245, 236, 0.38); }
        50% { box-shadow: 0 0 0 8px rgba(250, 245, 236, 0); }
      }
      @keyframes handle-float {
        0%, 100% { transform: translate(-50%, -50%) scale(1); }
        50% { transform: translate(-50%, -50%) scale(1.06); }
      }
      .icing-divider {
        animation: icing-wave 8s ease-in-out infinite alternate;
      }
      .por-dentro-layers li {
        opacity: 0;
        transform: translateX(-10px);
        transition: opacity 420ms var(--ease-out), transform 420ms var(--ease-out);
      }
      #por-dentro-copy.is-visible .por-dentro-layers li {
        opacity: 1;
        transform: translateX(0);
      }
      #por-dentro-copy.is-visible .por-dentro-layers li:nth-child(1) { transition-delay: 60ms; }
      #por-dentro-copy.is-visible .por-dentro-layers li:nth-child(2) { transition-delay: 140ms; }
      #por-dentro-copy.is-visible .por-dentro-layers li:nth-child(3) { transition-delay: 220ms; }
      #por-dentro-copy.is-visible .por-dentro-layers li:nth-child(4) { transition-delay: 300ms; }
      .hotspot-btn[aria-pressed="false"] {
        animation: hotspot-breathe 2.8s ease-in-out infinite;
      }
      .compare-handle {
        animation: handle-float 3.2s ease-in-out infinite;
      }

      .builder-piece {
        transition: fill 180ms var(--ease-out), opacity 180ms var(--ease-out), transform 180ms var(--ease-out);
      }

      .view-enter {
        animation: view-in 220ms var(--ease-out);
      }
      @keyframes view-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .modal-anim {
        animation: modal-in 220ms var(--ease-out);
      }
      @keyframes modal-in {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
      }

      .drawer-anim {
        animation: drawer-in 260ms var(--ease-out);
      }
      @keyframes drawer-in {
        from { transform: translateX(100%); }
        to { transform: translateX(0); }
      }

      .sheet-anim {
        animation: sheet-in 260ms var(--ease-out);
      }
      @keyframes sheet-in {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
      }

      .toast-anim {
        animation: toast-in 220ms var(--ease-out);
      }
      @keyframes toast-in {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }

      #curtain-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        overflow: hidden;
        display: none;
      }
      #curtain-overlay.is-active {
        display: block;
        pointer-events: auto;
      }
      .curtain-sheet {
        position: absolute;
        top: 0;
        left: -2%;
        width: 104%;
        height: 175vh;
        height: 175dvh;
        transform: translate3d(0, -104%, 0);
        will-change: transform;
      }
      #curtain-overlay.is-active .curtain-sheet {
        animation: chocolate-pour 1060ms cubic-bezier(0.32, 0.04, 0.24, 1) forwards;
      }
      @keyframes chocolate-pour {
        0% {
          transform: translate3d(0, -104%, 0);
        }
        40% {
          transform: translate3d(0, -14%, 0);
        }
        54% {
          transform: translate3d(0, -12%, 0);
        }
        100% {
          transform: translate3d(0, 102%, 0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 100ms !important;
        }
        #curtain-overlay {
          display: none !important;
        }
        .hero-line-inner,
        [data-reveal],
        .por-dentro-layers li {
          opacity: 1 !important;
          transform: none !important;
        }
      }
    }

    /* === LAYER: UTILITIES === */
    @layer utilities {
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .stack-sm { display: grid; gap: var(--s-2); }
      .stack-md { display: grid; gap: var(--s-4); }
      .stack-lg { display: grid; gap: var(--s-6); }
      .row-wrap { display: flex; flex-wrap: wrap; gap: var(--s-3); align-items: center; }
      .row-between { display: flex; flex-wrap: wrap; gap: var(--s-3); align-items: center; justify-content: space-between; }
      .muted { color: var(--text-soft); }
      .faint { color: var(--text-faint); font-size: 0.875rem; }
      .short-hero { min-height: 48vh; min-height: 48dvh; display: flex; align-items: center; padding-block: var(--s-7); }
      .about-hero { min-height: 56vh; min-height: 56dvh; display: flex; align-items: center; padding-block: var(--s-7); }
    }

    /* === LAYER: PRINT === */
    @layer print {
      @media print {
        .site-header, .notice-bar, .site-footer, .modal-backdrop, .drawer-backdrop, .sheet-backdrop, .toast-stack, .no-print, main {
          display: none !important;
        }
        #print-sheet {
          display: block !important;
          padding: 24px;
          font-family: var(--font-ui);
          color: #000;
        }
      }
    }
  </style>

      function escapeHTML(str) {
        return String(str ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function normalizeText(str) {
        return String(str ?? "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .trim();
      }

        const qNorm = normalizeText(query);
        if (!qNorm) return escapeHTML(raw);
        const normChars = [];
        const mapIdx = [];
        for (let i = 0; i < raw.length; i++) {
          const stripped = raw[i].normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
          for (let j = 0; j < stripped.length; j++) {
            normChars.push(stripped[j]);
            mapIdx.push(i);
          }
        }
        const normStr = normChars.join("");
        const idx = normStr.indexOf(qNorm);
        if (idx === -1) return escapeHTML(raw);
        const start = mapIdx[idx];
        const end = mapIdx[idx + qNorm.length - 1] + 1;
        return escapeHTML(raw.slice(0, start)) + "<mark>" + escapeHTML(raw.slice(start, end)) + "</mark>" + escapeHTML(raw.slice(end));
      }

      function clamp(val, min, max) {
        return Math.min(max, Math.max(min, val));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function isPlaceholder(val) {
        return typeof val === "string" && /^\[[A-ZÁÉÍÓÚÑ0-9_\/]+\]$/.test(val.trim());
      }

      function tVocab(plural = false, cap = false) {
        const w = plural ? CONFIG.VOCABULARIO.plural : CONFIG.VOCABULARIO.singular;
        if (!cap) return w;
        return w.charAt(0).toUpperCase() + w.slice(1);
      }

      function applyVocabText(text) {
        const sing = CONFIG.VOCABULARIO.singular;
        const plur = CONFIG.VOCABULARIO.plural;
        const Sing = sing.charAt(0).toUpperCase() + sing.slice(1);
        const Plur = plur.charAt(0).toUpperCase() + plur.slice(1);
        return String(text ?? "")
          .replace(/\bPasteles\b/g, Plur)
          .replace(/\bpasteles\b/g, plur)
          .replace(/\bPastel\b/g, Sing)
          .replace(/\bpastel\b/g, sing);
      }

      function nowInZone(nowDate = new Date()) {
        const d = nowDate instanceof Date ? nowDate : new Date(nowDate);
        const fmt = new Intl.DateTimeFormat("en-CA", {
          timeZone: CONFIG.ZONA_HORARIA,
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        });
        const parts = {};
        for (const p of fmt.formatToParts(d)) parts[p.type] = p.value;
        const hour = parts.hour === "24" ? "00" : parts.hour;
        const isoDate = `${parts.year}-${parts.month}-${parts.day}`;
        const timeStr = `${hour}:${parts.minute}`;
        const minutes = parseInt(hour, 10) * 60 + parseInt(parts.minute, 10);
        return { isoDate, timeStr, minutes, year: +parts.year, month: +parts.month, day: +parts.day };
      }

      function parseDateISO(iso) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(String(iso || ""))) return null;
        const [y, m, d] = iso.split("-").map(Number);
        const dt = new Date(Date.UTC(y, m - 1, d, 12, 0, 0));
        if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return null;
        return dt;
      }

      function formatDateISO(dt) {
        const y = dt.getUTCFullYear();
        const m = String(dt.getUTCMonth() + 1).padStart(2, "0");
        const d = String(dt.getUTCDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }

      function addDaysISO(iso, days) {
        const dt = parseDateISO(iso);
        if (!dt) return iso;
        dt.setUTCDate(dt.getUTCDate() + days);
        return formatDateISO(dt);
      }

      function diffDaysISO(isoA, isoB) {
        const a = parseDateISO(isoA);
        const b = parseDateISO(isoB);
        if (!a || !b) return 0;
        return Math.round((b.getTime() - a.getTime()) / 86400000);
      }

      function getDayOfWeekISO(iso) {
        const dt = parseDateISO(iso);
        return dt ? dt.getUTCDay() : 0;
      }

      function formatHumanDate(iso) {
        const dt = parseDateISO(iso);
        if (!dt) return iso;
        return new Intl.DateTimeFormat(CONFIG.LOCALE, {
          timeZone: "UTC",
          weekday: "short",
          day: "numeric",
          month: "short"
        }).format(dt);
      }

      function parseHHMM(str) {
        const [h, m] = String(str || "00:00").split(":").map(Number);
        return h * 60 + m;
      }

      function getDefaultDesign(baseProductId = null) {
        return {
          ocasion: "cumpleanos",
          invitados: 15,
          tamano: "p20",
          porPiso: false,
          pisos: [
            { sabor: "vainilla", relleno: "frutos-rojos" },
            { sabor: "vainilla", relleno: "crema-vainilla" },
            { sabor: "chocolate", relleno: "ganache" }
          ],
          cobertura: "mantequilla",
          decoracion: "intermedia",
          extras: [],
          colores: ["blanco-crema"],
          mensaje: "",
          tema: "",
          referencia: "",
          dietas: [],
          alergiasModo: "",
          alergiasTexto: "",
          fecha: "",
          entrega: "retiro",
          franja: "",
          base: baseProductId || ""
        };
      }

      function encodeDesign(design) {
        const d = design || getDefaultDesign();
        const pisosStr = (d.pisos || []).slice(0, 3).map(p => `${p.sabor}.${p.relleno}`).join(",");
        const extrasStr = (d.extras || []).join(",");
        const coloresStr = (d.colores || []).join(",");
        const dietasStr = (d.dietas || []).join(",");
        const msgB64 = d.mensaje ? btoa(unescape(encodeURIComponent(d.mensaje.slice(0, 40)))) : "";
        return [
          d.ocasion || "cumpleanos",
          d.invitados === null ? "ns" : String(d.invitados || 15),
          d.tamano || "p20",
          d.porPiso ? "1" : "0",
          pisosStr,
          d.cobertura || "mantequilla",
          d.decoracion || "intermedia",
          extrasStr,
          coloresStr,
          dietasStr,
          msgB64,
          d.base || ""
        ].join("~");
      }

      function decodeDesign(raw) {
        const def = getDefaultDesign();
        if (!raw || typeof raw !== "string") return def;
        const parts = raw.split("~");
        const validOc = new Set(BUILDER_OPTIONS.ocasiones.map(x => x.id));
        const validTam = new Set(BUILDER_OPTIONS.tamanos.map(x => x.id));
        const validSab = new Set(BUILDER_OPTIONS.sabores.map(x => x.id));
        const validRel = new Set(BUILDER_OPTIONS.rellenos.map(x => x.id));
        const validCob = new Set(BUILDER_OPTIONS.coberturas.map(x => x.id));
        const validDec = new Set(BUILDER_OPTIONS.decoraciones.map(x => x.id));
        const validExt = new Set(BUILDER_OPTIONS.extras.map(x => x.id));
        const validCol = new Set(BUILDER_OPTIONS.colores.map(x => x.id));
        const validDie = new Set(BUILDER_OPTIONS.dietas.map(x => x.id));

        if (parts[0] && validOc.has(parts[0])) def.ocasion = parts[0];
        if (parts[1]) {
          if (parts[1] === "ns") def.invitados = null;
          else {
            const n = parseInt(parts[1], 10);
            if (Number.isFinite(n) && n >= 1 && n <= 200) def.invitados = n;
          }
        }
        if (parts[2] && validTam.has(parts[2])) def.tamano = parts[2];
        if (parts[3] === "1") def.porPiso = true;
        if (parts[4]) {
          const tiers = parts[4].split(",").slice(0, 3);
          tiers.forEach((pair, idx) => {
            const [s, r] = pair.split(".");
            if (validSab.has(s)) def.pisos[idx].sabor = s;
            if (validRel.has(r)) def.pisos[idx].relleno = r;
          });
        }
        if (parts[5] && validCob.has(parts[5])) def.cobertura = parts[5];
        if (parts[6] && validDec.has(parts[6])) def.decoracion = parts[6];
        if (parts[7]) def.extras = parts[7].split(",").filter(id => validExt.has(id));
        if (parts[8]) {
          const cols = parts[8].split(",").filter(id => validCol.has(id)).slice(0, 2);
          if (cols.length) def.colores = cols;
        }
        if (parts[9]) def.dietas = parts[9].split(",").filter(id => validDie.has(id));
        if (parts[10]) {
          try { def.mensaje = decodeURIComponent(escape(atob(parts[10]))).slice(0, 40); } catch {}
        }
        if (parts[11] && PRODUCTS.some(p => p.id === parts[11])) def.base = parts[11];
        return def;
      }

      function generateFolio(nowDate = new Date()) {
        const { isoDate } = nowInZone(nowDate);
        const yymmdd = isoDate.replace(/-/g, "").slice(2);
        const alpha = "23456789ABCDEFGHJKMNPQRSTUVWXYZ";
        let code = "";
        for (let i = 0; i < 4; i++) {
          code += alpha[Math.floor(Math.random() * alpha.length)];
        }
        return `PED-${yymmdd}-${code}`;
      }

      /* === STORE === */
      const STORAGE_KEY = "pasteleria:v1";
      const memoryFallback = { raw: null };

      function safeReadStorage() {
        const empty = { v: 1, items: [], favs: [], draft: getDefaultDesign(), lastOrder: null, customer: { nombre: "", whatsapp: "", correo: "" } };
        try {
          const raw = window.localStorage.getItem(STORAGE_KEY) || memoryFallback.raw;
          if (!raw) return empty;
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== "object") return empty;
          return {
            v: 1,
            items: Array.isArray(parsed.items) ? parsed.items.slice(0, 20) : [],
            favs: Array.isArray(parsed.favs) ? parsed.favs : [],
            draft: parsed.draft && typeof parsed.draft === "object" ? Object.assign(getDefaultDesign(), parsed.draft) : getDefaultDesign(),
            lastOrder: parsed.lastOrder || null,
            customer: parsed.customer && typeof parsed.customer === "object" ? parsed.customer : empty.customer
          };
        } catch {
          return empty;
        }
      }

      function safeWriteStorage(state) {
        try {
          const serialized = JSON.stringify(state);
          memoryFallback.raw = serialized;
          window.localStorage.setItem(STORAGE_KEY, serialized);
        } catch {}
      }

      const STORE = {
        state: safeReadStorage(),
        save() { safeWriteStorage(this.state); },
        getItems() { return this.state.items; },
        addLine(line) {
          if (this.state.items.length >= 20) return { ok: false, reason: "Límite de 20 líneas alcanzado." };
          if (line.tipo === "producto") {
            const key = `${line.productoId}|${line.tamanoId}|${(line.opciones?.dietas || []).slice().sort().join(",")}|${line.opciones?.mensaje || ""}`;
            const existing = this.state.items.find(it => it.tipo === "producto" && `${it.productoId}|${it.tamanoId}|${(it.opciones?.dietas || []).slice().sort().join(",")}|${it.opciones?.mensaje || ""}` === key);
            if (existing) {
              existing.cantidad = clamp(existing.cantidad + (line.cantidad || 1), 1, 10);
              this.save();
              return { ok: true, id: existing.id };
            }
          }
          const id = line.id || ("ln-" + Math.random().toString(36).slice(2, 8));
          const cleanLine = Object.assign({}, line, {
            id,
            cantidad: line.tipo === "diseno" ? 1 : clamp(line.cantidad || 1, 1, 10)
          });
          this.state.items.push(cleanLine);
          this.save();
          return { ok: true, id };
        },
        updateLineQty(id, delta) {
          const item = this.state.items.find(x => x.id === id);
          if (!item || item.tipo === "diseno") return;
          item.cantidad = clamp(item.cantidad + delta, 1, 10);
          this.save();
        },
        replaceDesignLine(id, design, pricing) {
          const idx = this.state.items.findIndex(x => x.id === id);
          if (idx === -1) return false;
          this.state.items[idx] = buildDesignLine(design, pricing, id);
          this.save();
          return true;
        },
        removeLine(id) {
          this.state.items = this.state.items.filter(x => x.id !== id);
          this.save();
        },
        clearOrder() {
          this.state.items = [];
          this.save();
        },
        toggleFav(productId) {
          const i = this.state.favs.indexOf(productId);
          let added = false;
          if (i === -1) { this.state.favs.push(productId); added = true; }
          else this.state.favs.splice(i, 1);
          this.save();
          return added;
        },
        isFav(productId) {
          return this.state.favs.includes(productId);
        },
        setDraft(draft) {
          this.state.draft = draft;
          this.save();
        },
        resetDraft() {
          this.state.draft = getDefaultDesign();
          this.save();
        },
        setCustomer(data) {
          this.state.customer = Object.assign({}, this.state.customer, data);
          this.save();
        },
        setLastOrder(order) {
          this.state.lastOrder = order;
          this.save();
        }
      };

      function buildDesignLine(design, pricing, forcedId) {
        const tam = BUILDER_OPTIONS.tamanos.find(t => t.id === design.tamano) || BUILDER_OPTIONS.tamanos[1];
        return {
          id: forcedId || ("ln-" + Math.random().toString(36).slice(2, 8)),
          tipo: "diseno",
          nombre: `${tVocab(false, true)} a medida (${tam.etiqueta})`,
          cantidad: 1,
          diseno: JSON.parse(JSON.stringify(design)),
          precioUnitario: pricing.subtotalCents,
          cotizar: pricing.quoteOnly,
          cupos: pricing.cupos,
          plazoDias: pricing.minDays,
          pronta: 0
        };
      }

      /* === PRICING === */
      function calcProductUnitCents(product, tamanoId, dietas = []) {
        const tam = product.tamanos.find(t => t.id === tamanoId) || product.tamanos.find(t => t.defecto) || product.tamanos[0];
        let baseCents = toCents(tam.precio);
        let pct = 0;
        for (const dId of dietas) {
          const d = BUILDER_OPTIONS.dietas.find(x => x.id === dId);
          if (d) pct += d.pct;
        }
        return baseCents + Math.round((baseCents * pct) / 100);
      }

      function calcDesignPrice(design, isUrgent = false) {
        const tam = BUILDER_OPTIONS.tamanos.find(t => t.id === design.tamano) || BUILDER_OPTIONS.tamanos[1];
        const cob = BUILDER_OPTIONS.coberturas.find(c => c.id === design.cobertura) || BUILDER_OPTIONS.coberturas[0];
        const dec = BUILDER_OPTIONS.decoraciones.find(d => d.id === design.decoracion) || BUILDER_OPTIONS.decoraciones[0];

        let baseCents = toCents(tam.base);
        let saboresCents = 0;
        let rellenosCents = 0;
        for (let i = 0; i < tam.pisos; i++) {
          const tier = design.porPiso ? (design.pisos[i] || design.pisos[0]) : design.pisos[0];
          const sab = BUILDER_OPTIONS.sabores.find(s => s.id === tier.sabor) || BUILDER_OPTIONS.sabores[0];
          const rel = BUILDER_OPTIONS.rellenos.find(r => r.id === tier.relleno) || BUILDER_OPTIONS.rellenos[0];
          saboresCents += toCents(sab.recargo);
          rellenosCents += toCents(rel.recargo);
        }
        const coberturaCents = toCents(cob.recargo) * tam.pisos;
        const cuerpoCents = baseCents + saboresCents + rellenosCents + coberturaCents;

        let dietPct = 0;
        let dietExtraDia = 0;
        for (const dId of (design.dietas || [])) {
          const d = BUILDER_OPTIONS.dietas.find(x => x.id === dId);
          if (d) {
            dietPct += d.pct;
            dietExtraDia = Math.max(dietExtraDia, d.extraDia);
          }
        }
        const dietCents = Math.round((cuerpoCents * dietPct) / 100);
        const decoCents = toCents(dec.precio);
        let extrasCents = 0;
        for (const eId of (design.extras || [])) {
          const ex = BUILDER_OPTIONS.extras.find(x => x.id === eId);
          if (ex) extrasCents += toCents(ex.precio);
        }

        let subtotalCents = cuerpoCents + dietCents + decoCents + extrasCents;
        let urgentCents = 0;
        if (isUrgent && CONFIG.RECARGO_URGENTE_PORCENTAJE > 0) {
          urgentCents = Math.round((subtotalCents * CONFIG.RECARGO_URGENTE_PORCENTAJE) / 100);
          subtotalCents += urgentCents;
        }

        const pisosDias = tam.pisos === 1 ? 3 : (tam.pisos === 2 ? 5 : 14);
        const minDays = Math.max(dec.dias, pisosDias) + dietExtraDia;
        let cupos = 1;
        if (tam.pisos === 3 || dec.id === "escultorica") cupos = 4;
        else if (tam.pisos === 2 || dec.id === "elaborada") cupos = 2;

        return {
          quoteOnly: Boolean(dec.cotizar),
          subtotalCents,
          minDays,
          cupos,
          breakdown: { baseCents, saboresCents, rellenosCents, coberturaCents, dietCents, decoCents, extrasCents, urgentCents }
        };
      }

      function calcAnticipo(totalCents) {
        const anticipoCents = Math.round((totalCents * CONFIG.ANTICIPO_PORCENTAJE) / 100);
        return { anticipoCents, saldoCents: totalCents - anticipoCents };
      }

      function evaluateCoupon(code, subtotalCents, todayISO) {
        const clean = String(code || "").trim().toUpperCase();
        if (!clean || !CONFIG.CUPONES.length) return { valid: false, discountCents: 0, reason: "" };
        const cp = CONFIG.CUPONES.find(c => String(c.codigo).toUpperCase() === clean);
        if (!cp) return { valid: false, discountCents: 0, reason: "Cupón no encontrado." };
        if (cp.vigencia && todayISO > cp.vigencia) return { valid: false, discountCents: 0, reason: "Este cupón ya venció." };
        const minCents = toCents(cp.minimo || 0);
        if (subtotalCents < minCents) return { valid: false, discountCents: 0, reason: `Aplica desde ${formatMoney(minCents)}.` };
        const discountCents = cp.tipo === "porcentaje"
          ? Math.round((subtotalCents * Number(cp.valor || 0)) / 100)
          : Math.min(subtotalCents, toCents(cp.valor || 0));
        return { valid: true, discountCents, reason: "Cupón aplicado." };
      }

      function calcOrderTotals(items, zoneId = "retiro", couponCode = "", nowRef = new Date()) {
        let subtotalCents = 0;
        let hasQuoteOnly = false;
        let totalCupos = 0;
        for (const it of items) {
          if (it.cotizar) hasQuoteOnly = true;
          subtotalCents += (it.precioUnitario || 0) * (it.cantidad || 1);
          totalCupos += (it.cupos || 0) * (it.cantidad || 1);
        }
        const { isoDate } = nowInZone(nowRef);
        const coupon = evaluateCoupon(couponCode, subtotalCents, isoDate);
        const zone = ZONAS_ENTREGA.find(z => z.id === zoneId) || ZONAS_ENTREGA[0];
        const shippingQuote = Boolean(zone.cotizar);
        const shippingCents = shippingQuote ? 0 : toCents(zone.costo);
        const totalCents = Math.max(0, subtotalCents - coupon.discountCents + shippingCents);
        const { anticipoCents, saldoCents } = calcAnticipo(totalCents);
        return {
          subtotalCents,
          discountCents: coupon.discountCents,
          coupon,
          shippingCents,
          shippingQuote,
          totalCents,
          anticipoCents,
          saldoCents,
          hasQuoteOnly,
          totalCupos
        };
      }

      /* === SCHEDULE === */
      const SCHEDULE = {
        isStoreOpen(nowRef = new Date()) {
          const n = nowInZone(nowRef);
          if (CONFIG.FECHAS_BLOQUEADAS.includes(n.isoDate)) return false;
          const dow = getDayOfWeekISO(n.isoDate);
          const span = CONFIG.HORARIO_SEMANAL[dow];
          if (!span) return false;
          const openM = parseHHMM(span[0]);
          const closeM = parseHHMM(span[1]);
          return n.minutes >= openM && n.minutes < closeM;
        },

        nextOpening(nowRef = new Date()) {
          const n = nowInZone(nowRef);
          const dayNames = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
          const currentDow = getDayOfWeekISO(n.isoDate);
          const todaySpan = CONFIG.HORARIO_SEMANAL[currentDow];
          if (todaySpan && !CONFIG.FECHAS_BLOQUEADAS.includes(n.isoDate) && n.minutes < parseHHMM(todaySpan[0])) {
            return { dia: "hoy", hora: todaySpan[0], isoDate: n.isoDate };
          }
          for (let offset = 1; offset <= 14; offset++) {
            const candidate = addDaysISO(n.isoDate, offset);
            if (CONFIG.FECHAS_BLOQUEADAS.includes(candidate)) continue;
            const dow = getDayOfWeekISO(candidate);
            const span = CONFIG.HORARIO_SEMANAL[dow];
            if (span) {
              return { dia: offset === 1 ? "mañana" : dayNames[dow], hora: span[0], isoDate: candidate };
            }
          }
          return { dia: "próximo día hábil", hora: "09:00", isoDate: addDaysISO(n.isoDate, 1) };
        },

        getEffectiveBaseDate(nowRef = new Date()) {
          const n = nowInZone(nowRef);
          const cutoff = parseHHMM(CONFIG.HORA_CORTE_PEDIDOS);
          return n.minutes > cutoff ? addDaysISO(n.isoDate, 1) : n.isoDate;
        },

        cuposUsados(dateISO) {
          return Number(CONFIG.RESERVADOS[dateISO] || 0);
        },

        isDayOpen(dateISO) {
          if (CONFIG.FECHAS_BLOQUEADAS.includes(dateISO)) return false;
          const dow = getDayOfWeekISO(dateISO);
          return Boolean(CONFIG.HORARIO_SEMANAL[dow]);
        },

        getDayStatus(dateISO, minDateISO, cuposNeeded, nowRef = new Date()) {
          const { isoDate: todayISO } = nowInZone(nowRef);
          const horizonDiff = diffDaysISO(todayISO, dateISO);
          if (horizonDiff > CONFIG.DIAS_ADELANTE_MAX || horizonDiff < 0) {
            return { state: "out-of-range", available: false, reason: "Fuera de rango de reserva" };
          }
          if (!this.isDayOpen(dateISO)) {
            return { state: "closed", available: false, reason: "Cerrado o feriado" };
          }
          if (dateISO < minDateISO) {
            return { state: "too-soon", available: false, reason: "Anterior al plazo mínimo requerido" };
          }
          const used = this.cuposUsados(dateISO);
          const remainingAfter = CONFIG.CUPOS_POR_DIA - (used + cuposNeeded);
          if (remainingAfter < 0) {
            return { state: "full", available: false, reason: "Sin cupos disponibles" };
          }
          if (remainingAfter <= 2 && cuposNeeded > 0) {
            return { state: "low", available: true, reason: "Pocos cupos" };
          }
          return { state: "available", available: true, reason: "Disponible" };
        },

        getMinDateForLines(lines, nowRef = new Date()) {
          const n = nowInZone(nowRef);
          const itemList = lines && lines.length ? lines : [{ plazoDias: 3, cupos: 1, pronta: 0, tipo: "diseno", cantidad: 1 }];
          const maxLead = itemList.reduce((acc, ln) => Math.max(acc, Number(ln.plazoDias || 0)), 0);
          const cuposNeeded = itemList.reduce((acc, ln) => acc + Number(ln.cupos || 0) * Number(ln.cantidad || 1), 0);

          const allReadyToday = itemList.every(ln => {
            if (ln.cupos === 0) return true;
            return Number(ln.pronta || 0) >= Number(ln.cantidad || 1);
          });
          const beforeTodayCutoff = n.minutes <= parseHHMM(CONFIG.HORA_CORTE_HOY);

          let candidate;
          if (CONFIG.PRONTA_ENTREGA_ACTIVA && allReadyToday && this.isStoreOpen(nowRef) && beforeTodayCutoff) {
            candidate = n.isoDate;
          } else {
            const base = this.getEffectiveBaseDate(nowRef);
            candidate = addDaysISO(base, maxLead);
          }

          for (let i = 0; i <= CONFIG.DIAS_ADELANTE_MAX; i++) {
            const st = this.getDayStatus(candidate, candidate, cuposNeeded, nowRef);
            if (st.available) return candidate;
            candidate = addDaysISO(candidate, 1);
            if (diffDaysISO(n.isoDate, candidate) > CONFIG.DIAS_ADELANTE_MAX) break;
          }
          return candidate;
        },

        getSlotsForDate(dateISO, nowRef = new Date()) {
          if (!this.isDayOpen(dateISO)) return [];
          const dow = getDayOfWeekISO(dateISO);
          const span = CONFIG.HORARIO_SEMANAL[dow];
          if (!span) return [];
          const openM = parseHHMM(span[0]);
          const closeM = parseHHMM(span[1]);
          const n = nowInZone(nowRef);
          const isToday = dateISO === n.isoDate;
          const minStartToday = n.minutes + CONFIG.MARGEN_HORAS * 60;

          return CONFIG.FRANJAS.filter(slot => {
            const parts = slot.split(" a ");
            if (parts.length !== 2) return false;
            const sStart = parseHHMM(parts[0]);
            const sEnd = parseHHMM(parts[1]);
            if (sStart < openM || sEnd > closeM) return false;
            if (isToday && sStart < minStartToday) return false;
            return true;
          });
        },

        getActiveSeason(nowRef = new Date()) {
          const { isoDate } = nowInZone(nowRef);
          for (const temp of TEMPORADAS) {
            if (isPlaceholder(temp.desde) || isPlaceholder(temp.hasta) || isPlaceholder(temp.nombre)) continue;
            if (!parseDateISO(temp.desde) || !parseDateISO(temp.hasta)) continue;
            if (isoDate >= temp.desde && isoDate <= temp.hasta) return temp;
          }
          return null;
        }
      };

      function getDynamicFaqs(nowRef = new Date()) {
        const leads = PRODUCTS.filter(p => p.cupos > 0).map(p => p.anticipacionDias);
        const minLead = Math.min(...leads);
        const maxLead = Math.max(...leads);
        const nextDate = formatHumanDate(SCHEDULE.getMinDateForLines([], nowRef));
        const zonesText = ZONAS_ENTREGA.map(z => `${z.nombre}: ${z.cotizar ? "a cotizar" : formatMoney(toCents(z.costo))}`).join("; ");
        return [
          { q: "¿Con cuánta anticipación debo pedir?", a: `Los productos del catálogo requieren entre ${minLead} y ${maxLead} días según complejidad; la primera fecha posible calculada hoy es ${nextDate}.` },
          { q: "¿Cómo reservo mi fecha?", a: `Con un anticipo del ${CONFIG.ANTICIPO_PORCENTAJE}% del total. El saldo se paga [CUÁNDO_SE_PAGA_EL_SALDO].` },
          { q: "¿Puedo cambiar o cancelar?", a: "[POLÍTICA_CANCELACIÓN]." },
          { q: "¿Cómo manejan alergias y dietas?", a: `Ofrecemos opciones bajo pedido y detallamos los alérgenos en cada producto. Revisa la sección de Alérgenos (#/alergenos). [AVISO_ALÉRGENOS]` },
          { q: "¿Hacen entregas y cuánto cuestan?", a: `Zonas y costos de referencia: ${zonesText}.` },
          { q: `¿Cómo conservo y transporto mi ${tVocab(false)}?`, a: `Consulta la guía de transporte en plano y refrigeración en Cuidados (#/cuidados).` },
          { q: "¿Puedo traer mi propio diseño?", a: "Sí, envías tu imagen de referencia por WhatsApp al completar el resumen; el resultado es una interpretación hecha a mano [CONFIRMAR_ALCANCE]." },
          { q: "¿Hacen pedidos para empresas?", a: "Sí, preparamos cajas por volumen y mesas dulces para equipos. Revisa Pedidos para empresas (#/servicio/corporativo)." },
          { q: "¿Cómo sé que mi pedido está confirmado?", a: `Solo cuando ${CONFIG.NOMBRE_EMPRESA} responde confirmando disponibilidad y recibe el anticipo; enviar el resumen no reserva la fecha.` }
        ];
      }
      /* === ROUTER & CURTAIN === */
      const CURTAIN = {
        colors: [
          { hex: "#F2AFC3", hi: "#FAD3DF", shade: "#C97D95", name: "Rosa pastel" },
          { hex: "#633923", hi: "#875338", shade: "#3B1E0F", name: "Chocolate" },
          { hex: "#F4D66E", hi: "#FAE9A6", shade: "#C8A438", name: "Amarillo mantequilla" },
          { hex: "#A6D9C4", hi: "#CBECE0", shade: "#73AF96", name: "Verde menta" },
          { hex: "#E7D5B9", hi: "#F4E8D5", shade: "#BCA481", name: "Beige vainilla" }
        ],
        colorIdx: 0,
        isTransitioning: false,

        play(onCovered) {
          const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          const overlay = document.getElementById("curtain-overlay");
          if (reduced || !overlay) {
            onCovered();
            return;
          }
          if (this.isTransitioning) return;
          this.isTransitioning = true;

          const tone = this.colors[this.colorIdx];
          this.colorIdx = (this.colorIdx + 1) % this.colors.length;

          overlay.style.setProperty("--curtain-fill", tone.hex);
          overlay.style.setProperty("--curtain-hi", tone.hi);
          overlay.style.setProperty("--curtain-shade", tone.shade);

          overlay.classList.remove("is-active");
          void overlay.offsetWidth;
          overlay.classList.add("is-active");

          // Cambio de sección justo cuando la cortina cubre al 100% la pantalla (40%-54% de 1060ms)
          setTimeout(() => {
            try { onCovered(); } catch {}
          }, 475);

          setTimeout(() => {
            overlay.classList.remove("is-active");
            this.isTransitioning = false;
            const h1 = document.getElementById("view-h1");
            if (h1 && document.activeElement === document.body) {
              h1.focus({ preventScroll: true });
            }
          }, 1070);
        }
      };

      const ROUTER = {
        current: { path: "/inicio", params: new URLSearchParams(), baseView: "/inicio" },
        lastModalTrigger: null,
        openedFromInside: false,
        catalogSkeletonDone: false,
        _internalNav: false,

        parse(rawHash = window.location.hash) {
          const clean = (rawHash || "#/inicio").replace(/^#/, "");
          const [rawPath, rawQuery = ""] = clean.split("?");
          const path = rawPath.startsWith("/") ? rawPath : "/" + rawPath;
          return { path, params: new URLSearchParams(rawQuery) };
        },

        buildHash(path, params) {
          const qs = params && params.toString() ? "?" + params.toString() : "";
          return "#" + path + qs;
        },

        isModalPath(path) {
          return (
            path.startsWith("/pastel/") ||
            path.startsWith("/servicio/") ||
            path.startsWith("/diseno/") ||
            path === "/cotizar" ||
            path === "/carrito" ||
            path === "/pedido" ||
            path === "/seguimiento" ||
            path === "/faq" ||
            path === "/cuidados" ||
            path === "/alergenos" ||
            path === "/politicas" ||
            path === "/privacidad"
          );
        },

        getBaseForModal(path) {
          if (path.startsWith("/pastel/")) return "/pasteles";
          if (path.startsWith("/servicio/")) return "/servicios";
          return this.current.baseView || "/inicio";
        },

        getNavGroup(path) {
          if (path === "/inicio") return "/inicio";
          if (path === "/pasteles" || path.startsWith("/pastel/")) return "/pasteles";
          if (path === "/arma-tu-pastel") return "/arma-tu-pastel";
          if (path === "/servicios" || path.startsWith("/servicio/") || path === "/cotizar") return "/servicios";
          if (path === "/nosotros") return "/nosotros";
          return this.current.baseView || "/inicio";
        },

        transitionTo(hash, { replace = false, triggerEl = null } = {}) {
          if (CURTAIN.isTransitioning) return;
          UI.closeMobileMenu();
          CURTAIN.play(() => {
            this._internalNav = true;
            this.navigate(hash, { replace, triggerEl, skipCurtain: true });
            this._internalNav = false;
          });
        },

        navigate(hash, { replace = false, triggerEl = null, skipCurtain = false } = {}) {
          if (triggerEl) this.lastModalTrigger = triggerEl;
          const target = this.parse(hash);
          const willModal = this.isModalPath(target.path);
          if (!skipCurtain && !willModal && target.path !== this.current.baseView) {
            this.transitionTo(hash, { replace, triggerEl });
            return;
          }
          const wasModal = this.isModalPath(this.current.path);
          if (!wasModal && willModal) this.openedFromInside = true;

          if (replace) history.replaceState(null, "", hash);
          else history.pushState(null, "", hash);

          this.resolve();
        },

        handleExternalNav() {
          const parsed = this.parse(window.location.hash);
          if (parsed.path === this.current.path && parsed.params.toString() === this.current.params.toString()) {
            return;
          }
          if (!this._internalNav && !this.isModalPath(parsed.path) && parsed.path !== this.current.baseView) {
            if (!CURTAIN.isTransitioning) {
              CURTAIN.play(() => this.resolve());
            }
            return;
          }
          this.resolve();
        },

        closeModal(forceConfirm = false) {
          if (this.current.path === "/pedido" && !forceConfirm && !window.__skipConfirm && CHECKOUT.hasDirtyFields()) {
            if (!CHECKOUT.confirmCloseArmed) {
              CHECKOUT.confirmCloseArmed = true;
              UI.toast("Tienes datos escritos. Toca cerrar de nuevo para salir.");
              clearTimeout(CHECKOUT._closeTimer);
              CHECKOUT._closeTimer = setTimeout(() => { CHECKOUT.confirmCloseArmed = false; }, 4500);
              return;
            }
          }
          CHECKOUT.confirmCloseArmed = false;
          if (this.openedFromInside && history.length > 1) {
            history.back();
          } else {
            const base = this.getBaseForModal(this.current.path);
            this.navigate("#" + base, { replace: true });
          }
        },

        resolve() {
          const parsed = this.parse(window.location.hash);
          const validViews = new Set(["/inicio", "/pasteles", "/arma-tu-pastel", "/servicios", "/nosotros"]);
          const knownModals = ["/faq", "/cuidados", "/alergenos", "/politicas", "/privacidad", "/cotizar", "/carrito", "/pedido", "/seguimiento"];
          const isValid =
            validViews.has(parsed.path) ||
            knownModals.includes(parsed.path) ||
            parsed.path.startsWith("/pastel/") ||
            parsed.path.startsWith("/servicio/") ||
            parsed.path.startsWith("/diseno/");

          if (!isValid) {
            history.replaceState(null, "", "#/inicio");
            this.current = { path: "/inicio", params: new URLSearchParams(), baseView: "/inicio" };
          } else {
            const baseView = validViews.has(parsed.path)
              ? parsed.path
              : this.getBaseForModal(parsed.path);
            this.current = { path: parsed.path, params: parsed.params, baseView };
          }

          RENDER.renderAll();
        }
      };

      /* === RENDER HELPERS === */
