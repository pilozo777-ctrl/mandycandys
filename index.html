      function renderProductCard(p, { matchedDiet = "", query = "", priority = false } = {}) {
        const minSize = p.tamanos.reduce((a, b) => (b.precio < a.precio ? b : a), p.tamanos[0]);
        const minCents = toCents(minSize.precio);
        const oldCents = p.antes ? toCents(p.antes) : 0;
        const discPct = oldCents > minCents ? Math.round(((oldCents - minCents) / oldCents) * 100) : 0;

        let badgeHtml = "";
        if (!p.disponible || p.badge === "Agotado") badgeHtml = `<span class="product-badge badge-agotado">Agotado</span>`;
        else if (p.badge === "Nuevo") badgeHtml = `<span class="product-badge badge-nuevo">Nuevo</span>`;
        else if (p.badge === "Temporada") badgeHtml = `<span class="product-badge badge-temporada">Temporada</span>`;
        else if (p.badge === "Más pedido") badgeHtml = `<span class="product-badge badge-mas-pedido">Más pedido</span>`;
        else if (p.badge === "Por encargo") badgeHtml = `<span class="product-badge badge-encargo">Por encargo</span>`;

        const catObj = CATEGORIES.find(c => c.id === p.cat);
        const favActive = STORE.isFav(p.id);
        const minDate = SCHEDULE.getMinDateForLines([{ plazoDias: p.anticipacionDias, cupos: p.cupos, pronta: p.pronta, cantidad: 1 }]);
        const showTodayStock = CONFIG.PRONTA_ENTREGA_ACTIVA && p.pronta > 0 && p.disponible;
        const warnStock = showTodayStock && p.pronta <= 3;

        const dietsList = p.dietas.slice(0, 2).map(dId => {
          const isMatch = matchedDiet === dId;
          const label = isMatch ? `Disponible ${DIETA_LABELS[dId].toLowerCase()}, bajo pedido` : DIETA_LABELS[dId];
          return `<span class="diet-tag ${isMatch ? "is-matched" : ""}">${renderIcon("ic-leaf", 13)} ${escapeHTML(label)}</span>`;
        });
        if (p.dietas.length > 2) dietsList.push(`<span class="diet-tag">+${p.dietas.length - 2}</span>`);

        const ratingHtml = CONFIG.MOSTRAR_VALORACIONES && p.resenas > 0
          ? `<div class="rating-row"><span class="rating-stars">${renderIcon("ic-star", 14)}</span><span>${p.rating.toFixed(1)} (${p.resenas})</span></div>`
          : "";

        const waOutMsg = encodeURIComponent(`Hola ${CONFIG.NOMBRE_EMPRESA}, ¿cuándo estará disponible ${applyVocabText(p.nombre)}?`);
        const waOutUrl = `https://wa.me/${String(CONFIG.WHATSAPP).replace(/\D/g, "")}?text=${waOutMsg}`;

        const footHtml = p.disponible
          ? `<div class="product-foot">Elegir tamaño</div>`
          : `<div class="product-foot"><a href="${waOutUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-secondary btn-sm card-action-front">${renderIcon("ic-whatsapp", 16)} Avisarme por WhatsApp</a></div>`;

        return `
          <article class="card-box product-card ${!p.disponible ? "is-unavailable" : ""}" data-flip-id="prod-${p.id}">
            <div class="product-media">
              ${badgeHtml}
              <button type="button" class="fav-btn card-action-front" data-fav-id="${p.id}" aria-pressed="${favActive}" aria-label="Guardar ${escapeHTML(applyVocabText(p.nombre))} en favoritos">
                ${renderIcon(favActive ? "ic-heart-fill" : "ic-heart", 18)}
              </button>
              ${renderProductMedia(p, priority)}
            </div>
            <div class="product-body">
              <span class="data-label">${escapeHTML(applyVocabText(catObj ? catObj.nombre : p.cat))}</span>
              <h3 class="product-title">
                <a href="#/pastel/${p.id}" class="stretched-link">${highlightMatch(applyVocabText(p.nombre), query)}</a>
              </h3>
              <p class="product-desc">${highlightMatch(applyVocabText(p.d1), query)} <span class="product-desc-line2">${highlightMatch(applyVocabText(p.d2), query)}</span></p>
              ${dietsList.length ? `<div class="diet-tags">${dietsList.join("")}</div>` : ""}
              ${ratingHtml}
              <div class="product-price-row">
                <span class="price-from">Desde</span>
                <span class="price-now">${formatMoney(minCents)}</span>
                ${discPct > 0 ? `<span class="price-old">${formatMoney(oldCents)}</span><span class="price-disc">-${discPct}%</span>` : ""}
              </div>
              <div class="avail-row ${warnStock ? "is-warning" : ""}">
                <span class="avail-dot" aria-hidden="true"></span>
                <span>${showTodayStock ? `Hoy: quedan ${p.pronta}` : `Por encargo, desde ${escapeHTML(formatHumanDate(minDate))}`}</span>
              </div>
              ${footHtml}
            </div>
          </article>
        `;
      }

      function renderBuilderSVG(design) {
        const tam = BUILDER_OPTIONS.tamanos.find(t => t.id === design.tamano) || BUILDER_OPTIONS.tamanos[1];
        const col1 = (BUILDER_OPTIONS.colores.find(c => c.id === design.colores[0]) || BUILDER_OPTIONS.colores[0]).hex;
        const col2 = design.colores[1] ? (BUILDER_OPTIONS.colores.find(c => c.id === design.colores[1]) || {}).hex || col1 : col1;
        const isChoc = design.cobertura === "ganache-cob";
        const isNaked = design.cobertura === "semidesnudo";

        const tiers = [];
        const widths = tam.pisos === 1 ? [240] : tam.pisos === 2 ? [260, 176] : [280, 206, 138];
        const tierH = tam.pisos === 3 ? 72 : 90;
        let currentY = 398;

        for (let i = 0; i < tam.pisos; i++) {
          const w = widths[i];
          const x = 240 - w / 2;
          const y = currentY - tierH;
          const tierCfg = design.porPiso ? (design.pisos[i] || design.pisos[0]) : design.pisos[0];
          const sabColor = (BUILDER_OPTIONS.sabores.find(s => s.id === tierCfg.sabor) || BUILDER_OPTIONS.sabores[0]).color;
          const relColor = (BUILDER_OPTIONS.rellenos.find(r => r.id === tierCfg.relleno) || BUILDER_OPTIONS.rellenos[0]).color;
          const fillMain = isChoc ? "#5B3A29" : (isNaked ? sabColor : (i % 2 === 0 ? col1 : col2));
          tiers.push(`
            <g class="builder-piece" data-flip-id="tier-${i}">
              <rect x="${x}" y="${y}" width="${w}" height="${tierH}" rx="10" fill="${fillMain}" stroke="#5B3A29" stroke-width="2.5"/>
              <rect x="${x + 12}" y="${y + Math.round(tierH * 0.44)}" width="${w - 24}" height="8" rx="3" fill="${relColor}" opacity="${isNaked ? 0.95 : 0.45}"/>
            </g>
          `);
          currentY = y;
        }

        const topY = currentY;
        const topW = widths[widths.length - 1];
        const topX = 240 - topW / 2;

        const hasDrip = design.extras.includes("drip") || design.decoracion === "intermedia";
        const dripHtml = hasDrip
          ? `<path class="builder-piece" d="M${topX} ${topY + 6}h${topW}v14c-14 0-14 18-28 18s-14-14-28-14-14 20-28 20-14-16-28-16-14 16-28 16v-38z" fill="#5B3A29"/>`
          : "";
        const hasFlores = design.extras.includes("flores") || design.decoracion === "elaborada";
        const floresHtml = hasFlores
          ? `<g class="builder-piece" style="transform-origin:${topX + 40}px ${topY}px"><circle cx="${topX + 34}" cy="${topY - 2}" r="12" fill="#C94768"/><circle cx="${topX + 54}" cy="${topY - 6}" r="10" fill="#F2C4CB"/><circle cx="${topX + topW - 36}" cy="${topY - 2}" r="11" fill="#C94768"/></g>`
          : "";

      function renderCalendar(idPrefix, { selectedDate, selectedSlot, minDateISO, cuposNeeded, showSlots = true, monthOffset = 0, nowRef = new Date() }) {
        const minDt = parseDateISO(minDateISO) || parseDateISO(nowInZone(nowRef).isoDate);
        const viewDt = new Date(Date.UTC(minDt.getUTCFullYear(), minDt.getUTCMonth() + monthOffset, 1, 12, 0, 0));
        const year = viewDt.getUTCFullYear();
        const month = viewDt.getUTCMonth();
        const monthLabel = new Intl.DateTimeFormat(CONFIG.LOCALE, { timeZone: "UTC", month: "long", year: "numeric" }).format(viewDt);

        const firstDow = viewDt.getUTCDay(); // 0=dom
        const mondayOffset = (firstDow + 6) % 7;
        const daysInMonth = new Date(Date.UTC(year, month + 1, 0, 12)).getUTCDate();
        const dows = ["Lu", "Ma", "Mi", "Ju", "Vi", "Sa", "Do"];

        let cells = "";
        for (let i = 0; i < mondayOffset; i++) cells += `<div></div>`;
        let availableCount = 0;

        for (let day = 1; day <= daysInMonth; day++) {
          const iso = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
          const st = SCHEDULE.getDayStatus(iso, minDateISO, cuposNeeded, nowRef);
          if (st.available) availableCount++;
          const isSelected = selectedDate === iso;
          const tag = st.state === "low" ? "Pocos" : st.state === "full" ? "Lleno" : "";
          const label = `${formatHumanDate(iso)}: ${st.reason}`;
          cells += `
            <button type="button"
              class="cal-day"
              role="gridcell"
              data-cal-day="${iso}"
              data-cal-prefix="${idPrefix}"
              data-state="${st.state}"
              aria-selected="${isSelected}"
              aria-disabled="${!st.available}"
              aria-label="${escapeHTML(label)}"
              title="${escapeHTML(label)}">
              <span>${day}</span>
              ${tag ? `<span class="cal-day-tag">${tag}</span>` : ""}
            </button>
          `;
        }

        const emptyNotice = availableCount === 0
          ? `<div class="row-between">
               <p class="faint">Sin fechas libres este mes.</p>
               <button type="button" class="btn btn-secondary btn-sm" data-cal-jump="${idPrefix}">Ir al próximo mes con fechas</button>
             </div>`
          : "";

        let slotsHtml = "";
        if (showSlots && selectedDate) {
          const slots = SCHEDULE.getSlotsForDate(selectedDate, nowRef);
          slotsHtml = `
            <div class="stack-sm">
              <span class="field-label">Franja horaria para ${escapeHTML(formatHumanDate(selectedDate))}</span>
              ${slots.length
                ? `<div class="chip-row">${slots.map(s => `<button type="button" class="chip" data-cal-slot="${escapeHTML(s)}" data-cal-prefix="${idPrefix}" aria-pressed="${selectedSlot === s}">${escapeHTML(s)}</button>`).join("")}</div>`
                : `<p class="field-help">No quedan franjas disponibles para esta fecha. Elige otro día.</p>`
              }
            </div>
          `;
        }

        return `
          <div class="cal-wrap" data-calendar="${idPrefix}">
            <div class="cal-head">
              <button type="button" class="btn btn-secondary btn-sm" data-cal-nav="-1" data-cal-prefix="${idPrefix}" aria-label="Mes anterior">Anterior</button>
              <strong style="text-transform:capitalize">${escapeHTML(monthLabel)}</strong>
              <button type="button" class="btn btn-secondary btn-sm" data-cal-nav="1" data-cal-prefix="${idPrefix}" aria-label="Mes siguiente">Siguiente</button>
            </div>
            <div class="cal-grid" role="grid" aria-label="Calendario de entrega ${escapeHTML(monthLabel)}">
              ${dows.map(d => `<div class="cal-dow" role="columnheader">${d}</div>`).join("")}
              ${cells}
            </div>
            ${emptyNotice}
            <div class="cal-legend">
              <span class="cal-legend-item"><span class="cal-swatch" style="background:var(--bg);border-color:var(--border-strong)"></span>Disponible</span>
              <span class="cal-legend-item"><span class="cal-swatch" style="background:#FFF4E2;border-color:var(--warning)"></span>Pocos cupos</span>
              <span class="cal-legend-item"><span class="cal-swatch" style="background:repeating-linear-gradient(-45deg,transparent,transparent 2px,rgba(36,23,18,.2) 2px,rgba(36,23,18,.2) 4px)"></span>Lleno</span>
              <span class="cal-legend-item"><span class="cal-swatch" style="opacity:.4;background:var(--surface-2)"></span>Cerrado o fuera de plazo</span>
            </div>
            ${slotsHtml}
          </div>
        `;
      }

      function getFilteredCatalogProducts(params) {
        const cat = params.get("cat") || "";
        const dieta = params.get("dieta") || "";
        const ocasion = params.get("ocasion") || "";
        const q = params.get("q") || "";
        const orden = params.get("orden") || "relevancia";
        const hoy = params.get("hoy") === "1";
        const fav = params.get("fav") === "1";
        const disp = params.get("disp") === "1";
        const qNorm = normalizeText(q);
        const now = nowInZone();
        const canOrderToday = SCHEDULE.isStoreOpen() && now.minutes <= parseHHMM(CONFIG.HORA_CORTE_HOY);

        let list = PRODUCTS.filter(p => {
          if (cat && p.cat !== cat) return false;
          if (dieta && !p.dietas.includes(dieta)) return false;
          if (ocasion && !p.ocasiones.includes(ocasion)) return false;
          if (disp && !p.disponible) return false;
          if (fav && !STORE.isFav(p.id)) return false;
          if (hoy) {
            if (!CONFIG.PRONTA_ENTREGA_ACTIVA || !p.disponible || p.pronta <= 0 || !canOrderToday) return false;
          }
          if (qNorm) {
            const catName = (CATEGORIES.find(c => c.id === p.cat) || {}).nombre || "";
            const dietsText = p.dietas.map(d => DIETA_LABELS[d] || d).join(" ");
            const haystack = normalizeText(`${p.nombre} ${catName} ${p.d1} ${p.d2} ${dietsText}`);
            if (!haystack.includes(qNorm)) return false;
          }
          return true;
        });

        const minPrice = p => Math.min(...p.tamanos.map(t => t.precio));
        if (orden === "precio-asc") list.sort((a, b) => minPrice(a) - minPrice(b));
        else if (orden === "precio-desc") list.sort((a, b) => minPrice(b) - minPrice(a));
        else if (orden === "novedad") {
          const rank = b => (b === "Nuevo" ? 0 : b === "Temporada" ? 1 : 2);
          list.sort((a, b) => rank(a.badge) - rank(b.badge));
        } else {
          const rank = b => (b === "Más pedido" ? 0 : b === "Nuevo" ? 1 : 2);
          list.sort((a, b) => rank(a.badge) - rank(b.badge));
        }
        return list;
      }

        renderBaseView(baseView, params) {
          const main = document.getElementById("contenido");
          const prevKey = main.dataset.viewKey || "";
          const nextKey = baseView;
          if (baseView === "/inicio") main.innerHTML = renderHome();
          else if (baseView === "/pasteles") main.innerHTML = renderCatalog(params);
          else if (baseView === "/arma-tu-pastel") main.innerHTML = renderBuilder(params);
          else if (baseView === "/servicios") main.innerHTML = renderServices();
          else if (baseView === "/nosotros") main.innerHTML = renderAbout();
          main.dataset.viewKey = nextKey;

          if (prevKey !== nextKey) {
            window.scrollTo(0, 0);
            const h1 = document.getElementById("view-h1");
            if (h1) h1.focus({ preventScroll: true });
            const announcer = document.getElementById("sr-announcer");
            if (announcer && h1) announcer.textContent = "Vista actual: " + h1.textContent;
          }

          if (baseView === "/pasteles" && !ROUTER.catalogSkeletonDone) {

              if (ROUTER.current.baseView === "/pasteles") {

              }

        renderOverlays(path, params) {

            modalRoot.innerHTML = "";

            else if (path === "/pedido") modalRoot.innerHTML = renderCheckoutModal();
            else if (path === "/seguimiento") modalRoot.innerHTML = renderTrackingModal();

          const meta = map[ROUTER.current.baseView] || map["/inicio"];
          document.title = applyVocabText(meta.t).slice(0, 60);

        renderAll() {

          this.renderBaseView(baseView, params);

        }
      };
      /* === BUILDER === */
      const BUILDER = {
        editingLineId: null,
        hydratedKey: "",

        getCurrentDesign(params) {
          const dParam = params.get("d");
          const baseParam = params.get("base");
          const refParam = params.get("ref");
          const editParam = params.get("editar");
          const key = `${dParam || ""}|${baseParam || ""}|${refParam || ""}|${editParam || ""}`;

          if (key && key !== this.hydratedKey) {
            this.hydratedKey = key;
            if (editParam) {
              const line = STORE.getItems().find(x => x.id === editParam && x.tipo === "diseno");
              if (line && line.diseno) {
                this.editingLineId = line.id;
                STORE.setDraft(JSON.parse(JSON.stringify(line.diseno)));
              }
            } else {
              this.editingLineId = null;
            }
            if (dParam) {
              STORE.setDraft(decodeDesign(dParam));
            } else if (baseParam && PRODUCTS.some(p => p.id === baseParam)) {
              const d = getDefaultDesign(baseParam);
              if (baseParam === "per-02") d.tamano = "d20";
              if (baseParam === "bod-01") d.tamano = "t25";
              STORE.setDraft(d);
            } else if (refParam) {
              const gal = GALLERY.find(g => g.id === refParam);
              if (gal) {
                const d = getDefaultDesign(gal.base);
                d.ocasion = gal.ocasion;
                d.tema = `Inspirado en: ${gal.nombre}`;
                STORE.setDraft(d);
              }
            }
          }
          return STORE.state.draft;
        },

        suggestSizeForGuests(invitados) {
          if (invitados === null || invitados === undefined) return null;
          const match = BUILDER_OPTIONS.tamanos.find(t => t.maxPorciones >= invitados);
          if (match) {
            return {
              tamanoId: match.id,
              text: `Para ${invitados} personas, ${match.etiqueta} rinde ${match.porciones} porciones.`
            };
          }
          return {
            tamanoId: "t25",
            text: `Para ${invitados} personas te sugerimos 3 pisos (60 a 80 porciones) o cotizar mesa dulce para evento.`
          };
        },

        validateStep(step, design) {
          if (step === 2 && !design.tamano) return "Elige un tamaño para continuar.";
          if (step === 3 && (!design.pisos[0]?.sabor || !design.pisos[0]?.relleno || !design.cobertura)) {
            return "Elige sabor, relleno y cobertura antes de avanzar.";
          }
          if (step === 4 && !design.decoracion) return "Elige un nivel de decoración.";
          if (step === 5) {
            if (!design.alergiasModo) return "Indica si tienes alergias importantes o marca 'No tengo alergias'.";
            if (design.alergiasModo === "si" && !design.alergiasTexto.trim()) return "Describe tus alergias para revisarlo contigo.";
          }
          if (step === 6) {
            if (!design.fecha) return "Elige una fecha disponible en el calendario.";
            if (!design.franja) return "Elige una franja horaria de entrega o retiro.";
          }
          return "";
        },

        getMaxReachableStep(design) {
          for (let s = 1; s <= 5; s++) {
            if (this.validateStep(s, design)) return s;
          }
          return 6;
        },

        syncUrl(paso, design) {
          const p = new URLSearchParams(ROUTER.current.params);
          p.set("paso", String(paso));
          p.set("d", encodeDesign(design));
          ROUTER.navigate(ROUTER.buildHash("/arma-tu-pastel", p), { replace: true });
        },

        composeWhatsAppMessage(design, pricing) {
          const tam = BUILDER_OPTIONS.tamanos.find(t => t.id === design.tamano) || BUILDER_OPTIONS.tamanos[1];
          const cob = BUILDER_OPTIONS.coberturas.find(c => c.id === design.cobertura) || BUILDER_OPTIONS.coberturas[0];
          const dec = BUILDER_OPTIONS.decoraciones.find(d => d.id === design.decoracion) || BUILDER_OPTIONS.decoraciones[0];
          const shareUrl = window.location.origin + window.location.pathname + "#/arma-tu-pastel?d=" + encodeDesign(design);
          const lines = [
            `Hola ${CONFIG.NOMBRE_EMPRESA}, armé este ${tVocab(false)} en la web:`,
            `Tamaño: ${tam.etiqueta} (${tam.porciones})`,
            `Cobertura: ${cob.nombre}`,
            `Decoración: ${dec.nombre}`,
            `Mensaje: ${design.mensaje || "Sin mensaje"}`,
            `Fecha: ${design.fecha || "Por definir"} ${design.franja || ""}`,
            `Estimado: ${pricing.quoteOnly ? "A cotizar" : formatMoney(pricing.subtotalCents)}`,
            `Enlace del diseño: ${shareUrl}`
          ];
          return lines.join("\n");
        }
      };

      /* === CHECKOUT === */

          nombre: STORE.state.customer.nombre || "",
          whatsapp: STORE.state.customer.whatsapp || "",
          correo: STORE.state.customer.correo || "",
          modoEntrega: "retiro",
          zona: "z1",

          referencia: "",

        validateWhatsApp(val) {

          if (!/^\+?\d{8,15}$/.test(clean)) return "Escribe tu WhatsApp con código de país (8 a 15 dígitos), por ejemplo +593999999999.";

        composeWhatsAppText(folio, items, totals, co, fullDetail = true) {
          const zone = co.modoEntrega === "retiro"
            ? { nombre: `Retiro en ${CONFIG.DIRECCION}` }
            : (ZONAS_ENTREGA.find(z => z.id === co.zona) || ZONAS_ENTREGA[1]);

          const lines = [
            `Hola ${CONFIG.NOMBRE_EMPRESA}, quiero hacer un pedido. Folio: ${folio}`,
            `Cliente: ${co.nombre} (${co.whatsapp})`,
            co.modoEntrega === "retiro"
              ? `Entrega: Retiro en ${CONFIG.DIRECCION}`
              : `Entrega: Domicilio en ${zone.nombre} - ${co.direccion}${co.referencia ? " (" + co.referencia + ")" : ""}${co.recibe ? " - Recibe: " + co.recibe : ""}`,
            `Fecha y franja: ${co.fecha} / ${co.franja}`,
            `Pedido:`
          ];

          for (const ln of items) {
            if (ln.tipo === "producto") {
              lines.push(`${ln.cantidad} x ${ln.nombre}${ln.resumenOpciones ? " (" + ln.resumenOpciones + ")" : ""}, ${formatMoney(ln.precioUnitario * ln.cantidad)}`);
            } else {
              const d = ln.diseno;
              const dLink = `${window.location.origin}${window.location.pathname}#/arma-tu-pastel?d=${encodeDesign(d)}`;
              if (fullDetail) {
                const sab = (BUILDER_OPTIONS.sabores.find(s => s.id === d.pisos[0]?.sabor) || {}).nombre || "";
                const rel = (BUILDER_OPTIONS.rellenos.find(r => r.id === d.pisos[0]?.relleno) || {}).nombre || "";
                const cob = (BUILDER_OPTIONS.coberturas.find(c => c.id === d.cobertura) || {}).nombre || "";
                lines.push(`1 x ${ln.nombre}, sabor ${sab}, relleno ${rel}, cobertura ${cob}, mensaje: ${d.mensaje || "sin mensaje"}, ${formatMoney(ln.precioUnitario)} (${dLink})`);
              } else {
                lines.push(`1 x ${ln.nombre}, ${formatMoney(ln.precioUnitario)} (${dLink})`);
              }
            }
          }

          if (co.dedicatoria) lines.push(`Tarjeta: ${co.dedicatoria}`);
          lines.push(`Alergias: ${co.alergias}`);
          if (co.observaciones) lines.push(`Observaciones: ${co.observaciones}`);
          lines.push(`Subtotal: ${formatMoney(totals.subtotalCents)}`);
          lines.push(`Envío: ${totals.shippingQuote ? "A cotizar" : formatMoney(totals.shippingCents)}`);
          lines.push(`Total: ${formatMoney(totals.totalCents)}`);
          lines.push(`Anticipo (${CONFIG.ANTICIPO_PORCENTAJE}%): ${formatMoney(totals.anticipoCents)}`);
          lines.push(`Pendiente de confirmación`);

          const raw = lines.join("\n");
          if (fullDetail && raw.length > 1500) {
            return { text: this.composeWhatsAppText(folio, items, totals, co, false).text, abbreviated: true, fullText: raw };
          }
          return { text: raw, abbreviated: false, fullText: raw };
        },

        async submit(formEl) {
          const co = this.draft;
          const errors = [];
          const setErr = (id, msg) => {
            const errEl = document.getElementById("err-" + id);
            const inpEl = document.getElementById(id);
            if (errEl) errEl.textContent = msg;
            if (inpEl) inpEl.setAttribute("aria-invalid", msg ? "true" : "false");
            if (msg && inpEl) errors.push(inpEl);
          };

          setErr("co-nombre", co.nombre.trim().length < 2 ? "Escribe tu nombre completo." : "");
          setErr("co-wa", this.validateWhatsApp(co.whatsapp));
          if (co.modoEntrega === "domicilio") {
            setErr("co-dir", co.direccion.trim().length < 5 ? "Escribe la dirección exacta para la entrega." : "");
          }
          const errFechaEl = document.getElementById("err-co-fecha");
          if (!co.fecha || !co.franja) {
            if (errFechaEl) errFechaEl.textContent = "Selecciona una fecha y franja horaria disponibles.";
            errors.push(errFechaEl);
          } else if (errFechaEl) errFechaEl.textContent = "";

          setErr("co-alergias", !co.alergias.trim() ? "Indica alergias importantes o escribe 'No tengo alergias'." : "");
          const errAcepto = document.getElementById("err-co-acepto");
          if (!co.acepto) {
            if (errAcepto) errAcepto.textContent = "Debes aceptar las políticas y la información de alérgenos.";
            errors.push(document.getElementById("co-acepto"));
          } else if (errAcepto) errAcepto.textContent = "";

          if (errors.length) {
            const first = errors[0];
            if (first && first.focus) first.focus();
            if (first && first.setAttribute) first.setAttribute("role", "alert");
            return;
          }

          STORE.setCustomer({ nombre: co.nombre.trim(), whatsapp: co.whatsapp.trim(), correo: co.correo.trim() });
          const items = STORE.getItems();
          const totals = calcOrderTotals(items, co.modoEntrega === "domicilio" ? co.zona : "retiro", co.cupon);
          let folio = generateFolio();
          const composed = this.composeWhatsAppText(folio, items, totals, co, true);

          if (CONFIG.ENDPOINT_PEDIDOS) {
            try {
              const ctrl = new AbortController();
              const tId = setTimeout(() => ctrl.abort(), 5000);
              const res = await fetch(CONFIG.ENDPOINT_PEDIDOS, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ folio, cliente: STORE.state.customer, entrega: co, items, totals }),
                signal: ctrl.signal
              });
              clearTimeout(tId);
              if (res.ok) {
                const j = await res.json().catch(() => null);
                if (j && j.folio) folio = j.folio;
              }
            } catch {
              UI.toast("No se pudo conectar al servidor; usa WhatsApp para enviar tu pedido.");
            }
          }

          const orderRecord = { folio, items: JSON.parse(JSON.stringify(items)), totals, co: JSON.parse(JSON.stringify(co)), fullText: composed.fullText };
          STORE.setLastOrder(orderRecord);
          TRACK.track("enviar_pedido", { folio, total: totals.totalCents });

          const waUrl = `https://wa.me/${String(CONFIG.WHATSAPP).replace(/\D/g, "")}?text=${encodeURIComponent(composed.text)}`;
          this.renderPrintSheet(orderRecord);
          this.showSuccessModal(orderRecord, waUrl, composed.abbreviated);

      /* === MOTION === */
      const MOTION = {
        observer: null,
        heroAnimated: false,

        initObserver() {
          if (this.observer) this.observer.disconnect();
          this.observer = new IntersectionObserver((entries) => {
            for (const entry of entries) {
              if (!entry.isIntersecting) {
                if (entry.target.id === "hero-visual") entry.target.classList.add("is-offscreen");
                continue;
              }
              if (entry.target.id === "hero-visual") {
                entry.target.classList.remove("is-offscreen");
                continue;
              }
              if (entry.target.hasAttribute("data-reveal")) {
                entry.target.classList.add("is-visible");
                const line = entry.target.querySelector(".steps-line");
                if (line) line.style.transform = "scaleX(1)";
                this.observer.unobserve(entry.target);
              }
              if (entry.target.hasAttribute("data-count-target")) {
                this.animateCounter(entry.target);
                this.observer.unobserve(entry.target);
              }
              if (entry.target.id === "compare-slider-box" && !window.__compareSwept) {
                window.__compareSwept = true;
                this.sweepCompare();
              }
            }
          }, { threshold: 0.15, rootMargin: "0px 0px -8% 0px" });
        },

        animateCounter(el) {
          const target = parseInt(el.dataset.countTarget || "0", 10);
          if (!target) return;
          if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            el.textContent = String(target);
            return;
          }
          const start = performance.now();
          const dur = 1200;
          const step = (now) => {
            const p = clamp((now - start) / dur, 0, 1);
            const eased = 1 - Math.pow(1 - p, 4);
            el.textContent = String(Math.round(target * eased));
            if (p < 1) requestAnimationFrame(step);
          };
          requestAnimationFrame(step);
        },

        sweepCompare() {
          if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
          const start = performance.now();
          const dur = 900;
          const tick = (now) => {
            const t = clamp((now - start) / dur, 0, 1);
            const pos = t < 0.5 ? lerp(50, 72, t * 2) : lerp(72, 50, (t - 0.5) * 2);
            this.setComparePos(Math.round(pos));
            if (t < 1) requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
        },

        setComparePos(pct) {
          window.__comparePos = clamp(pct, 5, 95);
          const ext = document.getElementById("compare-exterior");
          const div = document.getElementById("compare-divider");
          const hnd = document.getElementById("compare-handle");
          if (ext) ext.style.clipPath = `inset(0 ${100 - window.__comparePos}% 0 0)`;
          if (div) div.style.left = `${window.__comparePos}%`;
          if (hnd) {
            hnd.style.left = `${window.__comparePos}%`;
            hnd.setAttribute("aria-valuenow", String(window.__comparePos));
            hnd.setAttribute("aria-valuetext", `${window.__comparePos}% exterior visible`);
          }
        },

        updateNavIndicator() {
          const nav = document.getElementById("primary-nav");
          const ind = document.getElementById("nav-indicator");
          const active = nav ? nav.querySelector('.nav-tab[aria-current="page"]') : null;
          if (!nav || !ind || !active) {
            if (ind) ind.style.width = "0";
            return;
          }
          const nr = nav.getBoundingClientRect();
          const ar = active.getBoundingClientRect();
          ind.style.width = `${ar.width}px`;
          ind.style.transform = `translateX(${ar.left - nr.left}px)`;
        },

        afterRender(baseView) {
          this.initObserver();
          document.querySelectorAll("[data-reveal], [data-count-target], #hero-visual, #compare-slider-box").forEach(el => {
            this.observer.observe(el);
          });
          if (baseView === "/inicio") {
            requestAnimationFrame(() => document.body.classList.add("hero-ready"));
            const drip = document.querySelector(".hero-drip-stroke");
            if (drip && drip.getTotalLength && !this.heroAnimated) {
              this.heroAnimated = true;
              const len = drip.getTotalLength();
              drip.style.strokeDasharray = `${len}`;
              drip.style.strokeDashoffset = `${len}`;
              requestAnimationFrame(() => {
                drip.style.transition = "stroke-dashoffset 900ms var(--ease-out)";
                drip.style.strokeDashoffset = "0";
              });
            }
          }
        },

        captureFlip(selector) {
          const map = new Map();
          document.querySelectorAll(selector).forEach(el => {
            const k = el.getAttribute("data-flip-id");
            if (k) map.set(k, el.getBoundingClientRect());
          });
          return map;
        },

        playFlip(beforeMap, selector) {
          if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
          document.querySelectorAll(selector).forEach(el => {
            const k = el.getAttribute("data-flip-id");
            const first = k && beforeMap.get(k);
            if (!first) return;
            const last = el.getBoundingClientRect();
            const dx = first.left - last.left;
            const dy = first.top - last.top;
            if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
              el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "translate(0,0)" }], {
                duration: 240,
                easing: "cubic-bezier(0.23,1,0.32,1)"
              });
            }
          });
        }
      };

      /* === TRACK === */
      const TRACK = {

          if (typeof CONFIG.ANALITICA === "function") CONFIG.ANALITICA(evento, datos);

      /* === JSONLD === */
      function injectJsonLd() {
        const graph = [];
        const bakery = {
          "@type": "Bakery",
          name: isPlaceholder(CONFIG.NOMBRE_EMPRESA) ? undefined : CONFIG.NOMBRE_EMPRESA,
          telephone: isPlaceholder(CONFIG.WHATSAPP) ? undefined : CONFIG.WHATSAPP,
          address: isPlaceholder(CONFIG.DIRECCION) ? undefined : CONFIG.DIRECCION,
          areaServed: ZONAS_ENTREGA.filter(z => !isPlaceholder(z.nombre)).map(z => z.nombre),
          priceRange: "$$"
        };
        Object.keys(bakery).forEach(k => bakery[k] === undefined && delete bakery[k]);
        if (Object.keys(bakery).length > 2) graph.push(bakery);

        const faqPage = {
          "@type": "FAQPage",
          mainEntity: getDynamicFaqs().map(f => ({
            "@type": "Question",
            name: f.q,
            acceptedAnswer: { "@type": "Answer", text: f.a }
          }))
        };
        graph.push(faqPage);

        // Emit Product + Offer for catalog items with explicit fixed price (no placeholder fields)
        PRODUCTS.slice(0, 6).forEach(p => {
          const defSize = p.tamanos.find(t => t.defecto) || p.tamanos[0];
          if (!defSize || !defSize.precio || isPlaceholder(p.nombre)) return;
          const prodNode = {
            "@type": "Product",
            name: applyVocabText(p.nombre),
            description: applyVocabText(p.d1),
            offers: {
              "@type": "Offer",
              priceCurrency: CONFIG.MONEDA,
              price: Number(defSize.precio).toFixed(2),
              availability: p.disponible ? "https://schema.org/InStock" : "https://schema.org/OutOfStock"
            }
          };
          if (p.foto && !isPlaceholder(p.foto)) prodNode.image = p.foto;
          if (CONFIG.MOSTRAR_VALORACIONES && p.rating && p.resenas) {
            prodNode.aggregateRating = {
              "@type": "AggregateRating",
              ratingValue: String(p.rating),
              reviewCount: String(p.resenas)
            };
          }
          graph.push(prodNode);
        });

        const payload = { "@context": "https://schema.org", "@graph": graph };
        try {
          const validJson = JSON.stringify(payload);
          JSON.parse(validJson);
          const sc = document.createElement("script");
          sc.type = "application/ld+json";

        const msgBig = CHECKOUT.composeWhatsAppText(folioSample, bigItems, calcOrderTotals(bigItems), CHECKOUT.draft, true);
        add("T20", "WhatsApp y folio", folioOk && msgBig.abbreviated, `${folioSample}, abrev=${msgBig.abbreviated}`);

        const debugBarExists = Boolean(document.querySelector(".debug-allergen-bar"));

        const hasEmoji = emojiRe.test(document.body.innerText) || emojiRe.test(attrs);

        add("T25", "CSS sin reglas prohibidas", !cssBad, "Sin transition:all, 100vh ni uppercase");

        // T26

        // T27
        const hexLum = (hex) => {
          const n = hex.replace("#", "");
          const rgb = [0, 2, 4].map(i => parseInt(n.slice(i, i + 2), 16) / 255).map(c => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
          return 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
        };
        const ratio = (a, b) => {
          const la = hexLum(a), lb = hexLum(b);
          return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
        };
        const pairs = [
          ratio("#241712", "#FAF5EC"),
          ratio("#594439", "#FAF5EC"),
          ratio("#6D584C", "#FAF5EC"),
          ratio("#FFFFFF", "#9E2144"),
          ratio("#FAF5EC", "#241712")

      /* === BOOT === */
      function initEvents() {
        document.addEventListener("click", (e) => {
          const target = e.target;
          if (!(target instanceof Element)) return;

          const navLink = target.closest('a[href^="#/"]');
          if (navLink && e.button === 0 && !e.metaKey && !e.ctrlKey && !e.shiftKey && !e.altKey && navLink.target !== "_blank" && !navLink.hasAttribute("download")) {
            const href = navLink.getAttribute("href");
            const parsed = ROUTER.parse(href);
            if (!ROUTER.isModalPath(parsed.path) && parsed.path !== ROUTER.current.baseView) {
              e.preventDefault();
              if (!CURTAIN.isTransitioning) {
                ROUTER.transitionTo(href, { triggerEl: navLink });
              }
              return;
            }
          }

          if (target.closest("#notice-close-btn")) {
            try { sessionStorage.setItem("pasteleria:noticeClosed", "1"); } catch {}
            document.getElementById("notice-bar").hidden = true;
            return;
          }

          if (target.closest("#hdr-search-btn")) {
            ROUTER.navigate("#/pasteles");
            setTimeout(() => { const inp = document.getElementById("cat-search-input"); if (inp) inp.focus(); }, 60);
            return;
          }

          if (target.closest("#hdr-bag-btn")) {
            ROUTER.navigate("#/carrito", { triggerEl: target.closest("#hdr-bag-btn") });
            return;
          }

          if (target.closest("#hdr-menu-btn")) { UI.openMobileMenu(); return; }
          if (target.closest("#close-mob-menu") || target === document.getElementById("mobile-menu-drawer")) { UI.closeMobileMenu(); return; }

          if (target.closest("#open-filter-sheet-btn")) { UI.openFilterSheet(); return; }
          if (target.closest("#close-filter-sheet") || target.closest("#close-filter-sheet-done") || target === document.getElementById("sheet-root")) {
            UI.closeFilterSheet();
            return;
          }

          if (target.closest("[data-close-modal]") || target === document.getElementById("modal-root") || target === document.getElementById("drawer-root")) {
            ROUTER.closeModal();
            return;
          }

          const favBtn = target.closest("[data-fav-id]");
          if (favBtn) {
            const pid = favBtn.getAttribute("data-fav-id");
            const added = STORE.toggleFav(pid);
            favBtn.setAttribute("aria-pressed", String(added));
            if (added) {
              favBtn.classList.add("is-pulsing");
              setTimeout(() => favBtn.classList.remove("is-pulsing"), 180);
            }
            UI.toast(added ? "Guardado en favoritos" : "Quitado de favoritos");
            if (ROUTER.current.path.startsWith("/pastel/")) RENDER.renderOverlays(ROUTER.current.path, ROUTER.current.params);
            return;
          }

          const galOcBtn = target.closest("[data-gal-oc]");
          if (galOcBtn) {
            const before = MOTION.captureFlip('[data-flip-id^="gal-"]');
            window.__homeGalOc = galOcBtn.getAttribute("data-gal-oc");
            RENDER.renderBaseView("/inicio", ROUTER.current.params);
            MOTION.playFlip(before, '[data-flip-id^="gal-"]');
            return;
          }

          if (target.closest("#gal-more-btn")) {
            window.__homeGalLimit = GALLERY.length;
            RENDER.renderBaseView("/inicio", ROUTER.current.params);
            return;
          }

          const galNavBtn = target.closest("[data-gal-nav]");
          if (galNavBtn) {
            ROUTER.navigate(`#/diseno/${galNavBtn.getAttribute("data-gal-nav")}`, { replace: true });
            return;
          }

          const hsBtn = target.closest("[data-hotspot]");
          if (hsBtn) {
            window.__compareHotspot = Number(hsBtn.getAttribute("data-hotspot"));
            RENDER.renderBaseView("/inicio", ROUTER.current.params);
            return;
          }

          const segBtn = target.closest("[data-scroll-target]");
          if (segBtn) {
            const el = document.getElementById(segBtn.getAttribute("data-scroll-target"));
            if (el) el.scrollIntoView({ behavior: "smooth" });
            return;
          }

          const catFilter = target.closest("[data-filter-cat]");
          if (catFilter) {
            const before = MOTION.captureFlip('[data-flip-id^="prod-"]');
            const p = new URLSearchParams(ROUTER.current.params);
            const v = catFilter.getAttribute("data-filter-cat");
            if (v) p.set("cat", v); else p.delete("cat");
            ROUTER.navigate(ROUTER.buildHash("/pasteles", p), { replace: true });
            MOTION.playFlip(before, '[data-flip-id^="prod-"]');
            return;
          }

          const dietFilter = target.closest("[data-filter-dieta]");
          if (dietFilter) {
            const p = new URLSearchParams(ROUTER.current.params);
            const v = dietFilter.getAttribute("data-filter-dieta");
            if (p.get("dieta") === v) p.delete("dieta"); else p.set("dieta", v);
            ROUTER.navigate(ROUTER.buildHash("/pasteles", p), { replace: true });
            return;
          }

          const togFilter = target.closest("[data-filter-toggle]");
          if (togFilter) {
            const p = new URLSearchParams(ROUTER.current.params);
            const k = togFilter.getAttribute("data-filter-toggle");
            if (p.get(k) === "1") p.delete(k); else p.set(k, "1");
            ROUTER.navigate(ROUTER.buildHash("/pasteles", p), { replace: true });
            return;
          }

          if (target.closest("[data-filter-ocasion]")) {
            const p = new URLSearchParams(ROUTER.current.params);
            p.delete("ocasion");
            ROUTER.navigate(ROUTER.buildHash("/pasteles", p), { replace: true });
            return;
          }

          if (target.closest("#clear-filters-btn") || target.closest("#empty-clear-btn")) {
            ROUTER.navigate("#/pasteles", { replace: true });
            return;
          }

          if (target.closest("#cat-load-more")) {
            window.__catLimit = (window.__catLimit || 12) + 12;
            RENDER.renderBaseView("/pasteles", ROUTER.current.params);
            return;
          }

          const thumbBtn = target.closest("[data-pdp-thumb]");
          if (thumbBtn && window.__pdpState) {
            window.__pdpState.thumb = Number(thumbBtn.getAttribute("data-pdp-thumb"));
            RENDER.renderOverlays(ROUTER.current.path, ROUTER.current.params);
            return;
          }

          if (target.closest("#pdp-qty-minus") && window.__pdpState) {
            window.__pdpState.qty = clamp(window.__pdpState.qty - 1, 1, 10);
            RENDER.renderOverlays(ROUTER.current.path, ROUTER.current.params);
            return;
          }
          if (target.closest("#pdp-qty-plus") && window.__pdpState) {
            window.__pdpState.qty = clamp(window.__pdpState.qty + 1, 1, 10);
            RENDER.renderOverlays(ROUTER.current.path, ROUTER.current.params);
            return;
          }

          const addBtn = target.closest("#pdp-add-btn");
          if (addBtn && window.__pdpState) {
            const prod = PRODUCTS.find(x => x.id === window.__pdpState.id);
            if (!prod) return;
            const tam = prod.tamanos.find(t => t.id === window.__pdpState.tam) || prod.tamanos[0];
            const unitCents = calcProductUnitCents(prod, tam.id, window.__pdpState.dietas);
            const optsSummary = [tam.label, ...window.__pdpState.dietas.map(d => DIETA_LABELS[d]), window.__pdpState.mensaje].filter(Boolean).join(", ");
            const res = STORE.addLine({
              tipo: "producto",
              productoId: prod.id,
              tamanoId: tam.id,
              nombre: applyVocabText(prod.nombre),
              resumenOpciones: optsSummary,
              opciones: { dietas: [...window.__pdpState.dietas], mensaje: window.__pdpState.mensaje },
              cantidad: window.__pdpState.qty,
              precioUnitario: unitCents,
              cupos: prod.cupos,
              plazoDias: prod.anticipacionDias,
              pronta: prod.pronta
            });
            if (!res.ok) { UI.toast(res.reason); return; }
            TRACK.track("agregar_pedido", { id: prod.id, qty: window.__pdpState.qty });
            UI.flyToBag(addBtn);
            addBtn.classList.add("is-loading");
            addBtn.innerHTML = `<span class="spinner-ring" aria-hidden="true"></span> Agregando`;
            setTimeout(() => {
              addBtn.classList.remove("is-loading");
              addBtn.innerHTML = `${renderIcon("ic-check", 16)} Agregado`;
              RENDER.renderChrome();
              UI.toast(`${applyVocabText(prod.nombre)} agregado a tu pedido`, "Ver pedido", "#/carrito");
            }, 420);
            return;

          if (target.closest("#pdp-share-btn")) {
            const url = window.location.href;
            if (navigator.share) {
              navigator.share({ title: document.title, url }).catch(() => {});
            } else if (navigator.clipboard) {
              navigator.clipboard.writeText(url).then(() => UI.toast("Enlace copiado")).catch(() => {});

            RENDER.renderOverlays("/carrito", ROUTER.current.params);

            RENDER.renderOverlays("/carrito", ROUTER.current.params);

            if (cur > 1) BUILDER.syncUrl(cur - 1, STORE.state.draft);
            return;

            const err = BUILDER.validateStep(6, STORE.state.draft);
            if (err) {
              const el = document.getElementById("builder-error");
              if (el) el.textContent = err;
              return;
            }
            const pr = calcDesignPrice(STORE.state.draft);
            if (BUILDER.editingLineId) {
              STORE.replaceDesignLine(BUILDER.editingLineId, STORE.state.draft, pr);
              BUILDER.editingLineId = null;
            } else {
              STORE.addLine(buildDesignLine(STORE.state.draft, pr));
            }
            RENDER.renderChrome();
            ROUTER.navigate("#/carrito", { triggerEl: target });
            return;
          }
          if (target.closest("#b-copy-link")) {
            const url = window.location.origin + window.location.pathname + "#/arma-tu-pastel?d=" + encodeDesign(STORE.state.draft);
            if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => UI.toast("Enlace de tu diseño copiado")).catch(() => {});
            return;
          }
          if (target.closest("#b-reset-btn")) {
            const btn = target.closest("#b-reset-btn");
            if (btn.dataset.armed !== "1") {
              btn.dataset.armed = "1";
              btn.textContent = "Confirmar reinicio";
              setTimeout(() => {
                if (btn.isConnected) {
                  btn.dataset.armed = "";
                  btn.textContent = "Empezar de nuevo";
                }
              }, 4000);
              return;
            }
            STORE.resetDraft();
            BUILDER.syncUrl(1, STORE.state.draft);
            return;
          }

          // Calendar interactions
          const calNav = target.closest("[data-cal-nav]");
          if (calNav) {
            const prefix = calNav.getAttribute("data-cal-prefix");
            const delta = Number(calNav.getAttribute("data-cal-nav"));
            if (prefix === "builder") window.__calOffsetBuilder = (window.__calOffsetBuilder || 0) + delta;
            if (prefix === "checkout") window.__calOffsetCo = (window.__calOffsetCo || 0) + delta;
            if (prefix === "quote") window.__calOffsetQuote = (window.__calOffsetQuote || 0) + delta;
            RENDER.renderAll();
            return;
          }
          const calJump = target.closest("[data-cal-jump]");
          if (calJump) {
            const prefix = calJump.getAttribute("data-cal-jump");
            if (prefix === "builder") window.__calOffsetBuilder = (window.__calOffsetBuilder || 0) + 1;
            if (prefix === "checkout") window.__calOffsetCo = (window.__calOffsetCo || 0) + 1;
            if (prefix === "quote") window.__calOffsetQuote = (window.__calOffsetQuote || 0) + 1;
            RENDER.renderAll();
            return;
          }
          const calDay = target.closest("[data-cal-day]");
          if (calDay) {
            if (calDay.getAttribute("aria-disabled") === "true") {
              UI.toast(calDay.getAttribute("title") || "Fecha no disponible");
              return;
            }
            const iso = calDay.getAttribute("data-cal-day");
            const prefix = calDay.getAttribute("data-cal-prefix");
            if (prefix === "builder") {
              STORE.state.draft.fecha = iso;
              STORE.state.draft.franja = "";
              STORE.setDraft(STORE.state.draft);
              RENDER.renderBaseView("/arma-tu-pastel", ROUTER.current.params);
            } else if (prefix === "checkout") {
              CHECKOUT.draft.fecha = iso;
              CHECKOUT.draft.franja = "";
              RENDER.renderOverlays("/pedido", ROUTER.current.params);
            } else if (prefix === "quote") {
              window.__quoteDate = iso;
              RENDER.renderOverlays("/cotizar", ROUTER.current.params);
            }
            return;
          }
          const calSlot = target.closest("[data-cal-slot]");
          if (calSlot) {
            const slot = calSlot.getAttribute("data-cal-slot");
            const prefix = calSlot.getAttribute("data-cal-prefix");
            if (prefix === "builder") {
              STORE.state.draft.franja = slot;
              STORE.setDraft(STORE.state.draft);
              RENDER.renderBaseView("/arma-tu-pastel", ROUTER.current.params);
            } else if (prefix === "checkout") {
              CHECKOUT.draft.franja = slot;
              RENDER.renderOverlays("/pedido", ROUTER.current.params);
            }
            return;
          }

          if (target.closest("#co-copy-summary") && STORE.state.lastOrder) {
            if (navigator.clipboard) navigator.clipboard.writeText(STORE.state.lastOrder.fullText).then(() => UI.toast("Resumen copiado")).catch(() => {});
            return;
          }
          if (target.closest("#co-print-summary")) {
            window.print();
            return;
          }
          if (target.closest("#co-mark-sent")) {
            STORE.clearOrder();
            RENDER.renderChrome();
            ROUTER.navigate("#/seguimiento");
            return;
          }
        });

        document.addEventListener("input", (e) => {
          const t = e.target;
          if (!(t instanceof Element)) return;

          if (t.id === "cat-search-input") {
            const p = new URLSearchParams(ROUTER.current.params);
            const v = t.value;
            if (v) p.set("q", v); else p.delete("q");
            const pos = t.selectionStart;
            ROUTER.navigate(ROUTER.buildHash("/pasteles", p), { replace: true });
            const newInp = document.getElementById("cat-search-input");
            if (newInp) { newInp.focus(); newInp.setSelectionRange(pos, pos); }
            return;
          }
          if (t.id === "pdp-mensaje" && window.__pdpState) {
            window.__pdpState.mensaje = t.value.slice(0, 40);
            return;
          }
          if (t.id === "b-mensaje") { STORE.state.draft.mensaje = t.value.slice(0, 40); STORE.setDraft(STORE.state.draft); RENDER.renderBaseView("/arma-tu-pastel", ROUTER.current.params); return; }
          if (t.id === "b-tema") { STORE.state.draft.tema = t.value.slice(0, 300); STORE.setDraft(STORE.state.draft); return; }
          if (t.id === "b-ref-url") { STORE.state.draft.referencia = t.value; STORE.setDraft(STORE.state.draft); return; }
          if (t.id === "b-alergia-txt") { STORE.state.draft.alergiasTexto = t.value; STORE.setDraft(STORE.state.draft); return; }
          if (t.id === "calc-guests-input") { window.__calcGuests = t.value; RENDER.renderBaseView("/servicios", ROUTER.current.params); return; }

          if (t.id === "co-nombre") CHECKOUT.draft.nombre = t.value;
          if (t.id === "co-wa") CHECKOUT.draft.whatsapp = t.value;
          if (t.id === "co-email") CHECKOUT.draft.correo = t.value;
          if (t.id === "co-dir") CHECKOUT.draft.direccion = t.value;
          if (t.id === "co-ref") CHECKOUT.draft.referencia = t.value;
          if (t.id === "co-recibe") CHECKOUT.draft.recibe = t.value;
          if (t.id === "co-dedicatoria") CHECKOUT.draft.dedicatoria = t.value;
          if (t.id === "co-alergias") CHECKOUT.draft.alergias = t.value;
          if (t.id === "co-obs") CHECKOUT.draft.observaciones = t.value;
        });

        document.addEventListener("change", (e) => {
          const t = e.target;
          if (!(t instanceof Element)) return;

          if (t.id === "cat-sort-select") {
            const p = new URLSearchParams(ROUTER.current.params);
            p.set("orden", t.value);
            ROUTER.navigate(ROUTER.buildHash("/pasteles", p), { replace: true });
            return;
          }
          if (t.id === "calc-event-select") { window.__calcEvent = t.value; RENDER.renderBaseView("/servicios", ROUTER.current.params); return; }

          if (t.name === "pdp-tam" && window.__pdpState) {
            window.__pdpState.tam = t.value;
            RENDER.renderOverlays(ROUTER.current.path, ROUTER.current.params);
            return;
          }
          if (t.name === "pdp-dieta" && window.__pdpState) {
            const checked = [...document.querySelectorAll('input[name="pdp-dieta"]:checked')].map(x => x.value);
            window.__pdpState.dietas = checked;
            RENDER.renderOverlays(ROUTER.current.path, ROUTER.current.params);
            return;
          }

          // Builder changes
          const d = STORE.state.draft;
          if (t.name === "b-ocasion") { d.ocasion = t.value; STORE.setDraft(d); BUILDER.syncUrl(1, d); return; }
          if (t.name === "b-tamano") {
            const before = MOTION.captureFlip('[data-flip-id^="tier-"]');
            d.tamano = t.value;
            STORE.setDraft(d);
            BUILDER.syncUrl(2, d);
            MOTION.playFlip(before, '[data-flip-id^="tier-"]');
            return;
          }
          if (t.id === "b-por-piso") { d.porPiso = t.checked; STORE.setDraft(d); RENDER.renderBaseView("/arma-tu-pastel", ROUTER.current.params); return; }
          if (t.name && t.name.startsWith("b-sabor-")) {
            const idx = Number(t.getAttribute("data-tier-idx") || 0);
            d.pisos[idx].sabor = t.value;
            STORE.setDraft(d);
            BUILDER.syncUrl(3, d);
            return;
          }
          if (t.name && t.name.startsWith("b-relleno-")) {
            const idx = Number(t.getAttribute("data-tier-idx") || 0);
            d.pisos[idx].relleno = t.value;
            STORE.setDraft(d);
            BUILDER.syncUrl(3, d);
            return;
          }
          if (t.name === "b-cobertura") { d.cobertura = t.value; STORE.setDraft(d); BUILDER.syncUrl(3, d); return; }
          if (t.name === "b-deco") { d.decoracion = t.value; STORE.setDraft(d); BUILDER.syncUrl(4, d); return; }
          if (t.name === "b-color") {
            const sel = [...document.querySelectorAll('input[name="b-color"]:checked')].map(x => x.value).slice(0, 2);
            d.colores = sel.length ? sel : ["blanco-crema"];
            STORE.setDraft(d);
            BUILDER.syncUrl(4, d);
            return;
          }
          if (t.name === "b-extra") {
            d.extras = [...document.querySelectorAll('input[name="b-extra"]:checked')].map(x => x.value);
            STORE.setDraft(d);
            BUILDER.syncUrl(4, d);
            return;
          }
          if (t.name === "b-dieta") {
            d.dietas = [...document.querySelectorAll('input[name="b-dieta"]:checked')].map(x => x.value);
            STORE.setDraft(d);
            BUILDER.syncUrl(5, d);
            return;
          }
          if (t.name === "b-alergia-modo") {
            d.alergiasModo = t.value;
            STORE.setDraft(d);
            RENDER.renderBaseView("/arma-tu-pastel", ROUTER.current.params);
            return;
          }
          if (t.name === "b-entrega") {
            d.entrega = t.value;
            STORE.setDraft(d);
            RENDER.renderBaseView("/arma-tu-pastel", ROUTER.current.params);
            return;
          }

          if (t.name === "co-modo") { CHECKOUT.draft.modoEntrega = t.value; RENDER.renderOverlays("/pedido", ROUTER.current.params); return; }
          if (t.id === "co-zona") { CHECKOUT.draft.zona = t.value; RENDER.renderOverlays("/pedido", ROUTER.current.params); return; }
          if (t.id === "co-acepto") { CHECKOUT.draft.acepto = t.checked; return; }
        });

        document.addEventListener("submit", (e) => {
          const form = e.target;
          if (!(form instanceof HTMLFormElement)) return;
          e.preventDefault();

          if (form.id === "checkout-form") {
            CHECKOUT.submit(form);
            return;
          }
          if (form.id === "quote-form") {
            const nombre = document.getElementById("q-nombre").value.trim();
            const wa = document.getElementById("q-wa").value.trim();
            const errNombre = document.getElementById("err-q-nombre");
            const errWa = document.getElementById("err-q-wa");
            errNombre.textContent = nombre.length < 2 ? "Escribe tu nombre." : "";
            errWa.textContent = CHECKOUT.validateWhatsApp(wa);
            if (errNombre.textContent || errWa.textContent) return;
            STORE.setCustomer({ nombre, whatsapp: wa });
            const msg = [
              `COTIZACIÓN - ${CONFIG.NOMBRE_EMPRESA}`,
              `Nombre: ${nombre}`,
              `WhatsApp: ${wa}`,
              `Personas: ${document.getElementById("q-personas").value || "Por definir"}`,
              `Servicio: ${document.getElementById("q-servicio").value || "General"}`,
              `Fecha tentativa: ${window.__quoteDate || "Por definir"}`,
              `Detalles: ${document.getElementById("q-mensaje").value || "Sin detalles"}`
            ].join("\n");
            const waUrl = `https://wa.me/${String(CONFIG.WHATSAPP).replace(/\D/g, "")}?text=${encodeURIComponent(msg)}`;
            TRACK.track("cotizar", { nombre });
            const modalRoot = document.getElementById("modal-root");
            modalRoot.innerHTML = `<div class="modal-panel modal-sm modal-anim" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title" tabindex="-1">Solicitud lista</h2><button type="button" class="icon-btn" data-close-modal aria-label="Cerrar">${renderIcon("ic-close", 20)}</button></div><div class="stack-md"><p>Listo, ${escapeHTML(nombre)}. Te escribimos por WhatsApp en [TIEMPO_RESPUESTA].</p><a href="${waUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-primary btn-lg">Abrir WhatsApp con mi cotización</a></div></div>`;
            return;
          }
          if (form.id === "track-form") {
            const folio = document.getElementById("track-folio-input").value.trim();
            window.__trackFolio = folio;
            const res = document.getElementById("track-result");
            res.innerHTML = folio
              ? `<p class="muted">Consulta manual para <strong>${escapeHTML(folio)}</strong>: abre WhatsApp para confirmar en qué etapa está tu pedido.</p>`
              : `<p class="field-error">Ingresa un folio válido.</p>`;
          }
        });

        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            if (!document.getElementById("mobile-menu-drawer").hidden) UI.closeMobileMenu();
            else if (!document.getElementById("sheet-root").hidden) UI.closeFilterSheet();
            else if (ROUTER.isModalPath(ROUTER.current.path)) ROUTER.closeModal();
            return;
          }

          const galModal = document.querySelector("[data-gallery-modal]");
          if (galModal && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
            const curId = galModal.getAttribute("data-gallery-modal");
            const idx = GALLERY.findIndex(g => g.id === curId);
            if (idx !== -1) {
              const nextIdx = e.key === "ArrowRight" ? (idx + 1) % GALLERY.length : (idx - 1 + GALLERY.length) % GALLERY.length;
              ROUTER.navigate(`#/diseno/${GALLERY[nextIdx].id}`, { replace: true });
            }
            return;
          }

          const t = e.target;
          if (!(t instanceof Element)) return;

          if (t.id === "compare-handle") {
            let p = window.__comparePos ?? 50;
            if (e.key === "ArrowLeft") p -= 5;
            else if (e.key === "ArrowRight") p += 5;
            else if (e.key === "Home") p = 5;
            else if (e.key === "End") p = 95;
            else return;
            e.preventDefault();
            MOTION.setComparePos(p);
            return;
          }

          if (t.matches("[data-cal-day]")) {
            const curIso = t.getAttribute("data-cal-day");
            let nextIso = curIso;
            if (e.key === "ArrowLeft") nextIso = addDaysISO(curIso, -1);
            else if (e.key === "ArrowRight") nextIso = addDaysISO(curIso, 1);
            else if (e.key === "ArrowUp") nextIso = addDaysISO(curIso, -7);
            else if (e.key === "ArrowDown") nextIso = addDaysISO(curIso, 7);
            else return;
            e.preventDefault();
            const targetBtn = t.closest(".cal-wrap").querySelector(`[data-cal-day="${nextIso}"]`);
            if (targetBtn) targetBtn.focus();
          }
        });

        let draggingSlider = false;
        document.addEventListener("pointerdown", (e) => {
          const t = e.target;
          if (t instanceof Element && t.closest("#compare-handle")) {
            draggingSlider = true;
            t.closest("#compare-handle").setPointerCapture(e.pointerId);
          }
        });
        document.addEventListener("pointermove", (e) => {
          if (draggingSlider) {
            const box = document.getElementById("compare-slider-box");
            if (!box) return;
            const rect = box.getBoundingClientRect();
            const pct = Math.round(((e.clientX - rect.left) / rect.width) * 100);
            MOTION.setComparePos(pct);
            return;
          }
          const hv = document.getElementById("hero-visual");
          if (hv && window.matchMedia("(hover:hover) and (pointer:fine)").matches && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            const rect = hv.getBoundingClientRect();
            if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
              const nx = (e.clientX - rect.left) / rect.width - 0.5;
              const ny = (e.clientY - rect.top) / rect.height - 0.5;
              hv.style.transform = `translate(${nx * 14}px, ${ny * 14}px) rotate(${nx * 2}deg)`;
            } else {
              hv.style.transform = "";
            }
          }
        });
        document.addEventListener("pointerup", () => { draggingSlider = false; });

        window.addEventListener("scroll", () => {
          const y = window.scrollY;
          document.getElementById("site-header").classList.toggle("is-scrolled", y > 8);
          const docH = document.documentElement.scrollHeight - window.innerHeight;
          const prog = docH > 0 ? clamp(y / docH, 0, 1) : 0;
          document.getElementById("scroll-progress").style.transform = `scaleX(${prog.toFixed(3)})`;
        }, { passive: true });

        window.addEventListener("resize", () => MOTION.updateNavIndicator(), { passive: true });
        window.addEventListener("hashchange", () => ROUTER.handleExternalNav());
        window.addEventListener("popstate", () => ROUTER.handleExternalNav());
      }

      function bootApp() {
        const isDebug = new URLSearchParams(window.location.search).get("debug") === "1";
        if (isDebug) {
          const rob = document.querySelector('meta[name="robots"]');
          if (rob) rob.setAttribute("content", "noindex,nofollow");
        }
        initEvents();
        ROUTER.resolve();
        injectJsonLd();
        setInterval(() => RENDER.renderChrome(), 60000);
        if (isDebug) {
          window.__autotest = __autotest;
          __autotest();
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", bootApp);
      } else {
        bootApp();
      }
    })();
  </script>
</body>
</html>
